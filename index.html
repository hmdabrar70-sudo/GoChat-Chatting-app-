.bottom-nav{position:fixed;z-index:12;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:76px;padding:8px 12px max(8px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-around;background:var(--nav);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.nav-item{flex:1;height:58px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:11px;font-weight:700}.nav-item svg{width:23px;height:23px;fill:currentColor;display:block}.nav-item.selected{color:var(--accent)}.app-shell{padding-bottom:90px}.main-page{display:none;padding:0 16px 18px}.main-page.active{display:block}.nav-user-avatar{width:25px;height:25px;border-radius:50%;object-fit:cover;border:1px solid currentColor}.auth-wrap{min-height:100dvh;display:grid;place-items:center;padding:28px 22px;background:var(--bg)}.auth-card{width:100%;max-width:390px}.brand{font-size:29px;font-weight:850;letter-spacing:-1.1px;margin-bottom:10px}.auth-sub{color:var(--muted);font-size:14px;line-height:1.55;margin-bottom:34px}.auth-card h1{font-size:25px;margin:0 0 8px;letter-spacing:-.5px}.field{height:54px;border-radius:99px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;padding:0 18px;margin:12px 0}.field input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:15px}.field button{background:transparent;padding:5px;color:var(--muted);display:grid;place-items:center}.field button svg{width:21px;height:21px}.login-btn{height:54px;width:100%;border-radius:99px;background:var(--accent);color:white;font-weight:800;margin-top:12px}.error{color:#d94a4a;font-size:13px;min-height:20px;margin:10px 8px}.hidden{display:none!important}.app-shell{max-width:520px;min-height:100dvh;margin:auto;padding-bottom:12px}.topbar{justify-content:space-between}.icon-btn{border:0}.chat-row{cursor:pointer}.chat-view{position:fixed;z-index:40;inset:0;background:var(--bg);display:none;flex-direction:column;max-width:520px;margin:auto;left:0;right:0;width:100%;height:100%;overflow:hidden}.chat-view.open{display:flex}.chat-head{height:68px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);flex:none}.chat-head .back-btn{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}.chat-head .back-btn svg{width:21px;height:21px}.chat-head .avatar{width:42px;height:42px}.chat-head-info{min-width:0;flex:1}.chat-head-info strong{display:block;font-size:15px}.chat-head-info small{color:var(--muted);font-size:12px}.messages{flex:1;overflow:auto;padding:16px 13px 20px;display:flex;flex-direction:column;gap:9px}.msg{max-width:82%;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:14px;line-height:1.45;overflow-wrap:anywhere;position:relative}.msg.mine{align-self:flex-end;background:var(--accent);color:#fff;border-color:transparent;border-bottom-right-radius:5px}.msg:not(.mine){align-self:flex-start;border-bottom-left-radius:5px}.msg time{display:block;font-size:10px;opacity:.68;text-align:right;margin-top:4px}.msg img,.msg video{max-width:100%;max-height:260px;border-radius:10px;display:block}.msg audio{max-width:230px}.msg-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.msg-actions button{font-size:11px;background:var(--surface2);color:var(--text);padding:5px 8px;border-radius:20px}.reply-bar{display:none;padding:8px 14px;background:var(--surface2);font-size:12px;color:var(--muted);align-items:center;justify-content:space-between}.reply-bar.show{display:flex}.composer{display:flex;align-items:center;gap:7px;padding:10px 10px max(10px,env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}.composer input[type=text]{flex:1;min-width:0;height:44px;border:0;outline:0;background:var(--surface2);border-radius:99px;padding:0 15px;color:var(--text)}.tool-btn,.send{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--text);flex:none}.tool-btn svg,.send svg{width:21px;height:21px}.send{background:var(--accent);color:#fff}.file-input{display:none}.empty{padding:35px 10px;text-align:center;color:var(--muted);font-size:14px}.toast{z-index:40}.searchbar{margin-top:4px}.avatar-fallback{display:grid;place-items:center;font-weight:800;color:white;background:linear-gradient(135deg,#f59e0b,#ec4899)}

/* Active tab · online people strip */
.active-wrap{padding:8px 0 24px}
.active-empty{padding:48px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.active-grid{display:flex;flex-wrap:wrap;gap:18px 14px;padding:8px 4px 20px;justify-content:flex-start}
.active-person{width:76px;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:var(--text)}
.active-person:active{opacity:.75}
.active-av-wrap{position:relative;width:64px;height:64px;flex:none}
.active-av-wrap img{width:64px;height:64px;border-radius:50%;object-fit:cover;display:block;background:var(--surface2);border:2px solid var(--line)}
.active-online-dot{position:absolute;right:1px;bottom:1px;width:14px;height:14px;border-radius:50%;background:#22c55e;border:2.5px solid var(--bg);box-shadow:0 0 0 1px rgba(34,197,94,.25)}
.active-person-name{font-size:12px;font-weight:650;text-align:center;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}

/* Friend search results */
.search-results{margin:0 0 10px;display:none}
.search-results.show{display:block}
.search-section-label{font-size:12px;font-weight:750;color:var(--muted);padding:6px 4px 8px;text-transform:uppercase;letter-spacing:.4px}
.friend-row{display:flex;align-items:center;gap:13px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:transparent}
.friend-row:active{opacity:.8}
.friend-row .avatar{width:48px;height:48px}
.friend-meta{min-width:0;flex:1}
.friend-meta .name{font-size:15px;font-weight:750}
.friend-meta .uname{font-size:12px;color:var(--muted);margin-top:3px}
.friend-badge{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:99px}

/* Boot loader — prevent login flash while Firebase restores session */
#bootLoader{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-size:14px;font-weight:650}
#bootLoader.hidden{display:none!important}
#authScreen.hidden{display:none!important}

/* Full-screen media viewer */
.media-viewer{display:none;position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.96);align-items:center;justify-content:center;flex-direction:column;max-width:520px;margin:auto;left:0;right:0}
.media-viewer.open{display:flex}
.media-viewer-stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:56px 12px 24px;box-sizing:border-box;overflow:hidden}
.media-viewer-stage img,.media-viewer-stage video{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;background:#000}
.media-viewer-stage video{width:100%}
.zoom-actions-capsule{
  position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:14px;z-index:52;
  display:inline-flex;align-items:center;gap:0;padding:4px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 2px 12px rgba(0,0,0,.28);box-sizing:border-box
}
.zoom-actions-capsule .zoom-cap-btn{
  width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:#fff;
  display:grid;place-items:center;cursor:pointer;padding:0
}
.zoom-actions-capsule .zoom-cap-btn:active{opacity:.7}
.zoom-actions-capsule svg{width:20px;height:20px;fill:currentColor}
.media-menu-backdrop{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
.media-menu-backdrop.open{display:flex}
.media-menu-sheet{width:min(520px,100%);background:var(--surface);color:var(--text);border-radius:20px 20px 0 0;padding:12px 0 max(16px,env(safe-area-inset-bottom));box-shadow:var(--shadow)}
.media-menu-sheet button{width:100%;text-align:left;padding:14px 20px;background:transparent;border:0;color:var(--text);font-size:15px;font-weight:650;display:flex;align-items:center;gap:12px}
.media-menu-sheet button:active{background:var(--surface2)}
.media-menu-sheet button svg{width:20px;height:20px;flex:none}
.media-menu-cancel{border-top:1px solid var(--line)!important;color:var(--muted)!important;margin-top:4px}

/* Shared post attachment card */
.msg-attach{display:block;width:min(100%,240px);border-radius:14px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);text-align:left;padding:0;cursor:pointer;color:inherit}
.msg.mine .msg-attach{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2)}
.msg-attach-head{display:flex;align-items:center;gap:8px;padding:8px 10px}
.msg-attach-av{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#8883;flex:none}
.msg-attach-meta{min-width:0;flex:1}
.msg-attach-name{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-attach-user{font-size:11px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-attach-media{position:relative;width:100%;aspect-ratio:1.15;background:#000;overflow:hidden}
.msg-attach-media img,.msg-attach-media video{width:100%;height:100%;object-fit:cover;display:block}
.msg-attach-play{position:absolute;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;pointer-events:none}
.msg-attach-play.right{right:8px;bottom:8px}
.msg-attach-play.left{left:8px;bottom:8px}
.msg-attach-play svg{width:18px;height:18px}
.msg-attach-caption{padding:8px 10px;font-size:12px;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg a.msg-link{color:inherit;text-decoration:underline;word-break:break-all;font-weight:650}
.msg.mine a.msg-link{color:#fff}
.msg img[data-full],.msg video[data-full]{cursor:pointer}


/* —— Chat media (match main GoChat dimensions) —— */
.msg{position:relative;user-select:none;-webkit-user-select:none}
.msg.mine,.msg:not(.mine){max-width:82%}
.msg img[data-full]{display:block;width:min(100%,240px);max-width:240px;max-height:320px;height:auto;object-fit:contain;background:#000;cursor:pointer;border-radius:14px}
.msg .gc-chat-video-bubble{width:min(100%,240px);max-width:240px}
.msg .msg-attach{width:min(100%,240px);max-width:240px}
.gc-chat-video-bubble{position:relative;display:block;max-width:240px;border-radius:14px;overflow:hidden;background:#000;cursor:pointer;-webkit-tap-highlight-color:transparent}
.gc-chat-video-poster{display:block;width:100%;max-height:320px;object-fit:contain;background:#000;pointer-events:none}
.gc-chat-video-poster-empty{width:100%;height:180px;background:#111}
.gc-chat-video-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;pointer-events:none;z-index:2}
.gc-chat-video-play svg{width:22px;height:22px;margin-left:2px}

/* Hide permanent inline actions */
.msg-actions{display:none!important}

/* Long-press context sheet */
.msg-ctx-backdrop{display:none;position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.4);align-items:flex-end;justify-content:center}
.msg-ctx-backdrop.open{display:flex}
.msg-ctx-sheet{width:min(520px,100%);background:var(--surface);color:var(--text);border-radius:18px 18px 0 0;padding:8px 0 max(12px,env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:msgCtxUp .18s ease}
@keyframes msgCtxUp{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}
.msg-ctx-sheet button{width:100%;text-align:left;padding:14px 18px;background:transparent;border:0;color:var(--text);font-size:15px;font-weight:650;display:flex;align-items:center;gap:12px}
.msg-ctx-sheet button:active{background:var(--surface2)}
.msg-ctx-sheet button.danger{color:#e03131}
.msg-ctx-sheet button svg{width:20px;height:20px;flex:none}
.msg-ctx-cancel{border-top:1px solid var(--line)!important;color:var(--muted)!important;margin-top:4px;justify-content:center!important}

/* Custom voice player */

function captureVideoThumbBlob(file){
  return new Promise(function(resolve){
    try{
      var video = document.createElement('video');
      video.muted = true;
      video.playsInline = true;
      video.preload = 'auto';
      var url = URL.createObjectURL(file);
      video.src = url;
      var done = false;
      function finish(blob){
        if(done) return;
        done = true;
        try{ URL.revokeObjectURL(url); }catch(e){}
        resolve(blob || null);
      }
      video.onloadeddata = function(){
        try{ video.currentTime = Math.min(0.35, (video.duration||1) * 0.05); }catch(e){ finish(null); }
      };
      video.onseeked = function(){
        try{
          var c = document.createElement('canvas');
          c.width = video.videoWidth || 640;
          c.height = video.videoHeight || 360;
          c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
          c.toBlob(function(b){ finish(b); }, 'image/jpeg', 0.82);
        }catch(e){ finish(null); }
      };
      video.onerror = function(){ finish(null); };
      setTimeout(function(){ finish(null); }, 8000);
    }catch(e){ resolve(null); }
  });
}

function listenMessages(cid){
  if(msgUnsub){ try{ msgUnsub(); }catch(e){} msgUnsub=null; }
  var box = $('messages');
  if(box) box.innerHTML = '<div class="sk-msg" aria-hidden="true"><div class="sk-bubble w80"></div><div class="sk-bubble me w60"></div><div class="sk-bubble w50"></div><div class="sk-bubble me w80"></div><div class="sk-bubble w40"></div></div>';
  var q = db.collection('chats').doc(cid).collection('messages').orderBy('createdAt','desc').limit(50);
  var painted = false;
  function paint(snap){
    if(currentChat !== cid) return;
    var docs = snap.docs.slice().reverse();
    if(box){
      // Only auto-scroll if user is already near the bottom (or first paint)
      var nearBottom = true;
      try{
        if(painted){
          var dist = box.scrollHeight - box.scrollTop - box.clientHeight;
          nearBottom = dist < 120;
        }
      }catch(e){ nearBottom = true; }
      var prevHeight = box.scrollHeight;
      var prevTop = box.scrollTop;
      box.innerHTML = docs.map(function(d){ return renderMessage(d.id, d.data()); }).join('') || '<div class="empty">No messages yet. Say hello.</div>';
      if(!painted || nearBottom){
        box.scrollTop = box.scrollHeight;
      } else {
        // Keep relative position when reading older messages
        try{ box.scrollTop = Math.max(0, box.scrollHeight - prevHeight + prevTop); }catch(e){}
      }
    }
    painted = true;
    docs.forEach(function(d){
      var m = d.data() || {};
      if(user && m.uid !== user.uid && !m.read && !m.isSystem){
        try{ d.ref.update({ read:true, readAt: firebase.firestore.FieldValue.serverTimestamp() }); }catch(e){}
      }
    });
    try{ db.collection('chats').doc(cid).set({ isRead: true }, { merge: true }); }catch(e){}
  }
  // Fast first paint via get(), then live updates
  q.get().then(function(snap){ if(!painted) paint(snap); }).catch(function(){});
  msgUnsub = q.onSnapshot(function(s){ paint(s); }, function(err){
    console.warn('messages listen', err);
    if(box && currentChat===cid && !painted) box.innerHTML = '<div class="empty">Could not load messages.</div>';
  });
}

(function(){
  var voiceRecTimer = null, voiceRecStarted = 0, voiceDiscard = false;
  function fmtRec(ms){
    var s = Math.floor(ms/1000);
    var m = Math.floor(s/60); s = s % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function showRecBar(on){
    var bar = $('voiceRecBar'), comp = $('composer');
    if(bar) bar.hidden = !on;
    if(comp) comp.classList.toggle('voice-hidden', !!on);
  }
  function stopRecTimer(){
    if(voiceRecTimer){ clearInterval(voiceRecTimer); voiceRecTimer = null; }
  }
  function resetVoiceUi(){
    stopRecTimer();
    showRecBar(false);
    voiceState = 'idle';
    voiceDiscard = false;
    var tEl = $('voiceRecTime'); if(tEl) tEl.textContent = '0:00';
  }
  async function uploadVoiceBlob(blob){
    if(!blob || blob.size < 200){ toast('Recording too short'); return; }
    if(blob.size > 10*1024*1024){ toast('Voice message exceeds 10 MB'); return; }
    voiceState = 'uploading';
    toast('Sending voice…');
    try{
      var fd = new FormData();
      fd.append('file', blob, 'voice.webm');
      fd.append('upload_preset', 'gochat');
      var r = await fetch('https://api.cloudinary.com/v1_1/pfbi9lmx/video/upload', { method:'POST', body: fd });
      var j = await r.json();
      if(!r.ok || !j.secure_url) throw Error(j.error && j.error.message || 'Upload failed');
      await sendPayload({ audioUrl: j.secure_url });
      toast('Voice message sent');
    }catch(err){
      toast('Voice upload failed: ' + (err.message || err));
    }finally{
      voiceState = 'idle';
    }
  }
  function startVoiceRecording(){
    if(voiceState !== 'idle' || !currentChat) return;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
      toast('Voice recording is not supported here');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
      voiceStream = stream;
      voiceChunks = [];
      voiceDiscard = false;
      try{
        mediaRecorder = new MediaRecorder(stream);
      }catch(e){
        stream.getTracks().forEach(function(tr){ tr.stop(); });
        toast('Recorder unavailable');
        return;
      }
      mediaRecorder.ondataavailable = function(e){ if(e.data && e.data.size) voiceChunks.push(e.data); };
      mediaRecorder.onstop = function(){
        try{ if(voiceStream) voiceStream.getTracks().forEach(function(tr){ tr.stop(); }); }catch(e){}
        voiceStream = null;
        var blob = new Blob(voiceChunks, { type: (mediaRecorder && mediaRecorder.mimeType) || 'audio/webm' });
        mediaRecorder = null;
        if(voiceDiscard){ voiceChunks = []; resetVoiceUi(); return; }
        resetVoiceUi();
        uploadVoiceBlob(blob);
      };
      mediaRecorder.start(200);
      voiceState = 'recording';
      voiceRecStarted = Date.now();
      showRecBar(true);
      var tEl = $('voiceRecTime'); if(tEl) tEl.textContent = '0:00';
      stopRecTimer();
      voiceRecTimer = setInterval(function(){
        if(tEl) tEl.textContent = fmtRec(Date.now() - voiceRecStarted);
      }, 250);
    }).catch(function(err){
      toast('Microphone unavailable: ' + (err.message || err));
      resetVoiceUi();
    });
  }
  function cancelVoiceRecording(){
    if(voiceState !== 'recording' || !mediaRecorder){ resetVoiceUi(); return; }
    voiceDiscard = true;
    try{ mediaRecorder.stop(); }catch(e){ resetVoiceUi(); }
  }
  function sendVoiceRecording(){
    if(voiceState !== 'recording' || !mediaRecorder) return;
    voiceDiscard = false;
    try{ mediaRecorder.stop(); }catch(e){ resetVoiceUi(); toast('Could not finish recording'); }
  }
  var vb = $('voiceButton');
  if(vb) vb.onclick = function(){ startVoiceRecording(); };
  var vc = $('voiceRecCancel');
  if(vc) vc.onclick = function(){ cancelVoiceRecording(); };
  var vs = $('voiceRecSend');
  if(vs) vs.onclick = function(){ sendVoiceRecording(); };
})();

async function loadChatLists(){
  listUnsubs.forEach(function(u){ try{ u(); }catch(e){} });
  listUnsubs = [];
  chatMap.clear();
  var listEl = $('chatList');
  if(!listEl) return;
  if(!user){

  }

  // Instant paint from cache while Firestore loads
  try{
    var cached = localStorage.getItem('gc_msg_chatlist_v1');
    if(cached && user){
      var parsed = JSON.parse(cached);

        listEl.innerHTML = parsed.html || listEl.innerHTML;
      }
    }
  }catch(e){}

  var initial = true;
  var renderTimer = null;

  function scheduleRender(){
    if(renderTimer) clearTimeout(renderTimer);
    renderTimer = setTimeout(function(){
      renderTimer = null;
      renderChats();
      try{ renderActiveList(); }catch(e){}
    }, initial ? 0 : 16);
    initial = false;
  }

  function ingestChatDoc(id, data){
    if(!id) return;
    chatMap.set(id, { id: id, data: data || {} });
    var people = (data && (data.users || data.members)) || [];
    people.forEach(function(uid){ prefetchUser(uid); });
    if(data && !data.isGroup && String(id).indexOf('group_') !== 0){
      var parts = String(id).split('_');
      if(parts.length >= 2){
        // UIDs don't contain '_'; chatId is uidA_uidB
        var a = parts[0], b = parts.slice(1).join('_');
        if(a === user.uid) prefetchUser(b);
        else if(b === user.uid) prefetchUser(a);
        else {
          if(String(id).indexOf(user.uid) !== -1){
            var other = a === user.uid ? b : a;
            prefetchUser(other);
          }
        }
      }
    }
  }

  function prefetchUser(uid){
    if(!uid || uid === user.uid || usersCache.has(uid)) return;
    db.collection('users').doc(uid).get().then(function(u){
      if(u.exists){ usersCache.set(uid, Object.assign({ uid: uid }, u.data())); scheduleRender(); }
    }).catch(function(){});
  }

  function addSnap(snap){
    try{
      var changes = [];
      try { changes = snap.docChanges(); } catch(e) { changes = []; }
      if(changes && changes.length){
        changes.forEach(function(change){
          if(change.type === 'removed'){ chatMap.delete(change.doc.id); return; }
          ingestChatDoc(change.doc.id, change.doc.data() || {});
        });
      } else {
        snap.docs.forEach(function(d){ ingestChatDoc(d.id, d.data() || {}); });
      }
      scheduleRender();
    }catch(e){ console.error('chat snap error', e); }
  }

  function onErr(e){
    console.error('Chat list query failed', e);
    if(chatMap.size === 0 && listEl){
      listEl.innerHTML = '<div class="empty">Could not load chats: '+esc(e && e.message ? e.message : e)+'</div>';
    }
  }

  // Primary: same queries as main GoChat app
  try{
    listUnsubs.push(db.collection('chats').where('users','array-contains', user.uid).onSnapshot(addSnap, onErr));
    listUnsubs.push(db.collection('chats').where('members','array-contains', user.uid).onSnapshot(addSnap, function(e){ console.warn('group chat query', e); }));
  }catch(e){ onErr(e); }

  try{
    db.collection('chats').where('users','array-contains', user.uid).get().then(function(s){
      s.docs.forEach(function(d){ ingestChatDoc(d.id, d.data()||{}); });
      scheduleRender();
    }).catch(function(e){ console.warn('chat get', e); });
    db.collection('chats').where('members','array-contains', user.uid).get().then(function(s){
      s.docs.forEach(function(d){ ingestChatDoc(d.id, d.data()||{}); });
      scheduleRender();
    }).catch(function(){});
  }catch(e){}

  // Extra chat IDs stored on the user profile (pinned / muted / archived / accepted)
  try{
    var extra = []
      .concat(userData.pinnedChats || [])
      .concat(userData.mutedChats || [])
      .concat(userData.archivedChats || [])
      .concat(userData.acceptedChats || [])
      .concat(userData.activePrivateChats || []);
    var seen = {};
    extra.forEach(function(cid){
      if(!cid || seen[cid] || chatMap.has(cid)) return;
      seen[cid] = true;
      db.collection('chats').doc(cid).get().then(function(doc){
        if(doc.exists){ ingestChatDoc(doc.id, doc.data()||{}); scheduleRender(); }
      }).catch(function(){});
    });
  }catch(e){}

  // Probe deterministic 1:1 chat docs for network people (covers chats missing users[])
  loadPeopleAndProbeChats().then(function(){ scheduleRender(); }).catch(function(){});
}

function toMs(v){
  if(v == null || v === '') return 0;
  if(typeof v === 'number' && isFinite(v)) return v;
  if(typeof v.toMillis === 'function') return v.toMillis();
  if(typeof v.seconds === 'number') return v.seconds * 1000;
  var n = Number(v);
  return isFinite(n) ? n : 0;
}

function chatIdFor(otherUid){

/* Mutual follow = friends in main GoChat */
function isMutualFriend(otherUid){
  if(!user || !otherUid || otherUid === user.uid) return false;
  var mine = userData || {};
  var following = Array.isArray(mine.following) ? mine.following : [];
  var friends = Array.isArray(mine.friends) ? mine.friends : [];
  if(friends.indexOf(otherUid) !== -1) return true;
  if(following.indexOf(otherUid) === -1) return false;
  var u = usersCache.get(otherUid);
  if(u){
    var theirFollowing = Array.isArray(u.following) ? u.following : [];
    if(theirFollowing.indexOf(user.uid) !== -1) return true;
  }
  return friends.indexOf(otherUid) !== -1;
}

function getMutualFriendIds(){
  var ids = {};
  var mine = userData || {};
  var following = Array.isArray(mine.following) ? mine.following : [];
  var friends = Array.isArray(mine.friends) ? mine.friends : [];
  var followers = Array.isArray(mine.followers) ? mine.followers : [];
  friends.forEach(function(id){ if(id && id !== user.uid) ids[id] = true; });
  following.forEach(function(id){
    if(!id || id === user.uid) return;
    if(followers.indexOf(id) !== -1){ ids[id] = true; return; }
    var u = usersCache.get(id);
    if(u){
      var theirFollowing = Array.isArray(u.following) ? u.following : [];
      if(theirFollowing.indexOf(user.uid) !== -1) ids[id] = true;
    } else {
      ids[id] = true; // candidate until profile confirms
    }
  });
  followers.forEach(function(id){
    if(id && following.indexOf(id) !== -1) ids[id] = true;
  });
  return Object.keys(ids);
}

  }).join('');

async function loadPeopleAndProbeChats(){
  if(!user) return;
  var ids = {};
  function addId(x){ if(x && x !== user.uid) ids[x] = true; }
  try{
    var d = userData || {};
    (d.following || []).forEach(addId);
    (d.followers || []).forEach(addId);
    (d.friends || []).forEach(addId);
    (d.acceptedChats || []).forEach(addId);
    getMutualFriendIds().forEach(addId);
  }catch(e){}

  try{
    var snap = await db.collection('users').limit(200).get();
    snap.docs.forEach(function(doc){
      if(doc.id === user.uid) return;
      var data = doc.data() || {};
      usersCache.set(doc.id, Object.assign({ uid: doc.id }, data));
      var theirFollowing = Array.isArray(data.following) ? data.following : [];
      var myFollowing = Array.isArray((userData||{}).following) ? userData.following : [];
      if(myFollowing.indexOf(doc.id) !== -1 || theirFollowing.indexOf(user.uid) !== -1) addId(doc.id);
    });
  }catch(e){ console.warn('people directory', e); }

  var uidList = Object.keys(ids);
  var pending = uidList.filter(function(id){ return !usersCache.has(id); }).slice(0, 120);
  await Promise.all(pending.map(function(id){
    return db.collection('users').doc(id).get().then(function(u){
      if(u.exists) usersCache.set(id, Object.assign({ uid: id }, u.data() || {}));
    }).catch(function(){});
  }));

  var probe = uidList.slice(0, 200);
  await Promise.all(probe.map(function(otherUid){
    var cid = chatIdFor(otherUid);
    if(chatMap.has(cid)) return Promise.resolve();
    return db.collection('chats').doc(cid).get().then(function(doc){
      if(doc.exists){
        var data = doc.data() || {};
        if(!Array.isArray(data.users) || data.users.indexOf(user.uid) === -1){
          var sorted = [user.uid, otherUid].sort();
          db.collection('chats').doc(cid).set({ users: sorted }, { merge: true }).catch(function(){});
          data.users = sorted;
        }
        chatMap.set(doc.id, { id: doc.id, data: data });
      }
    }).catch(function(){});
  }));
}

function formatChatPreview(raw){
  if(raw == null || raw === '') return 'Start chatting';
  var s = String(raw).trim();
  if(!s) return 'Start chatting';
  if(/^📎\s*Story reply:/i.test(s)) return s;
  if(/cloudinary\.com\/[^\s]+\/video\/upload/i.test(s) || /\.(mp4|webm|mov)(\?|$)/i.test(s)) return 'Video';
  if(/cloudinary\.com\/[^\s]+\/image\/upload/i.test(s) || /\.(jpg|jpeg|png|webp|gif)(\?|$)/i.test(s)) return 'Photo';
  if(/^https?:\/\/\S+$/i.test(s)) return 'Link';
  if(s.length > 80) return s.slice(0, 77) + '…';
  return s;
}
function renderChats(){
  var listEl = $('chatList');
  if(!listEl || !user) return;
  var q = ($('chatSearch') && $('chatSearch').value || '').trim().toLowerCase();
  var rows = [];
  var seenPeople = {};

  chatMap.forEach(function(entry){
    var id = entry.id;
    var data = entry.data || {};
    var isGroup = !!(data.isGroup || String(id).indexOf('group_') === 0);

    // Membership: trust query results + chatId containing my uid + users/members arrays
    var isMyChat = false;
    if(String(id).indexOf(user.uid) !== -1) isMyChat = true;
    if(Array.isArray(data.users) && data.users.indexOf(user.uid) !== -1) isMyChat = true;
    if(Array.isArray(data.members) && data.members.indexOf(user.uid) !== -1) isMyChat = true;
    if(data.names && typeof data.names === 'object' && (user.uid in data.names)) isMyChat = true;
    if(!isMyChat) return;

    if(Array.isArray(data.hiddenFor) && data.hiddenFor.indexOf(user.uid) !== -1) return;

    // Clear Chat: hide only until a NEWER message exists (strictly after clear)
    var myClearAt = toMs((data.clearedAtBy || {})[user.uid]);
    if(myClearAt){
      var lastMs = toMs(data.lastAt || data.lastMsgAt || data.updatedAt);
      if(!lastMs || lastMs <= myClearAt) return;
    }

    if(isGroup){
      var gName = data.groupName || data.name || 'Group chat';
      rows.push({
        kind: 'chat', id: id, data: data, uid: 'group', group: true,
        name: gName,
        avatar: data.groupAvatar || data.avatar || avatar({ name: gName }),
        preview: formatChatPreview(data.lastMsg || data.lastMessage) || 'Group chat',
        sort: toMs(data.lastAt) || 1,
        unread: false
      });
      return;
    }

    var people = Array.isArray(data.users) ? data.users : (Array.isArray(data.members) ? data.members : []);
    var other = null;
    for(var i=0;i<people.length;i++){ if(people[i] && people[i] !== user.uid){ other = people[i]; break; } }
    if(!other){
      var parts = String(id).split('_');
      if(parts.length >= 2){
        var left = parts[0], right = parts.slice(1).join('_');
        if(left === user.uid) other = right;
        else if(right === user.uid) other = left;
        else if(String(id).indexOf(user.uid) === 0) other = String(id).slice(user.uid.length + 1);
        else if(String(id).indexOf(user.uid) > 0) other = String(id).slice(0, String(id).indexOf(user.uid) - 1);
      }
    }
    if(!other) return;
    seenPeople[other] = true;

    var u = usersCache.get(other) || {};
    var names = data.names || {};
    var avatars = data.avatars || {};
    var displayName = u.name || u.displayName || names[other] || 'GoChat user';
    var displayAv = u.avatar || u.photoURL || avatars[other] || avatar({ name: displayName });
    rows.push({
      kind: 'chat', id: id, data: data, uid: other, group: false,
      name: displayName, avatar: displayAv,
      preview: formatChatPreview(data.lastMsg || data.lastMessage) || 'Start chatting',
      sort: toMs(data.lastAt) || 1,
      unread: !!(data.lastSender && data.lastSender !== user.uid && data.isRead === false)
    });
  });

  // Sort conversations by latest activity first
  rows.sort(function(a,b){ return (b.sort || 0) - (a.sort || 0); });

  if(q){
    rows = rows.filter(function(x){
      return (x.name || '').toLowerCase().indexOf(q) !== -1
        || String(x.uid || '').toLowerCase().indexOf(q) !== -1
        || String(x.preview || '').toLowerCase().indexOf(q) !== -1;
    });
  }

  if(!rows.length){
    listEl.innerHTML = '<div class="empty">No conversations yet.<br><span style="font-size:12px;opacity:.75">Chats from the main GoChat app appear here once loaded.</span></div>';
    return;
  }

  listEl.innerHTML = rows.map(function(x){
    return '<button class="chat-row" type="button" data-chat="'+esc(x.id)+'" data-uid="'+esc(x.uid)+'" data-name="'+esc(x.name)+'" data-avatar="'+esc(x.avatar)+'" data-group="'+(x.group?'true':'false')+'">'
      + '<img class="avatar" src="'+esc(x.avatar)+'" alt="">'
      + '<span class="chat-main"><span class="name-line"><span class="name">'+esc(x.name)+'</span><span class="time">'+esc(fmt(x.data.lastAt))+'</span></span>'
      + '<span class="preview">'+esc(x.preview || '')+'</span></span>'
      + (x.unread ? '<span class="unread">•</span>' : '')
      + '</button>';
  }).join('');
  // Persist for instant next open
  try{
    if(user){
      localStorage.setItem('gc_msg_chatlist_v1', JSON.stringify({
        uid: user.uid,
        at: Date.now(),
        html: listEl.innerHTML
      }));
    }
  }catch(e){}
}

  function setLikeIcon(btn, on){

  function relTime(ts){

      var d = ts && ts.toDate ? ts.toDate() : (ts instanceof Date ? ts : null);
      if(!d) return '';
      var s = Math.max(0, (Date.now()-d.getTime())/1000);
      if(s<60) return 'now';
      if(s<3600) return Math.floor(s/60)+'m';

    }catch(e){ return ''; }
  }
  function isExpired(s){
    try{
      if(s.expiresAt && s.expiresAt.toDate) return s.expiresAt.toDate().getTime() < Date.now();

      var all = [];
      snap.forEach(function(d){
        var s = Object.assign({id:d.id}, d.data()||{});
        if(isExpired(s)) return;
        if(!s.mediaUrl && !s.isText) return;
        all.push(s);
      });
      var allow = followingSet();
      var byUid = {};
      all.forEach(function(s){

        if(!byUid[s.uid]) byUid[s.uid] = { uid:s.uid, name:s.name||'User', avatar:s.avatar||'', items:[] };

        if(s.avatar) byUid[s.uid].avatar = s.avatar;
      });
      Object.keys(byUid).forEach(function(uid){
        byUid[uid].items.sort(function(a,b){
          var ta=a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0;
          var tb=b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0;
          return ta-tb;
        });
      });
      var groups = [];
      if(user && byUid[user.uid]){ groups.push(byUid[user.uid]); delete byUid[user.uid]; }
      Object.keys(byUid).forEach(function(uid){ groups.push(byUid[uid]); });
      // unseen first for others
      groups.sort(function(a,b){
        if(user && a.uid===user.uid) return -1;
        if(user && b.uid===user.uid) return 1;
        var au = a.items.some(function(s){ return !s.views || s.views.indexOf(user.uid)===-1; });
        var bu = b.items.some(function(s){ return !s.views || s.views.indexOf(user.uid)===-1; });

  function nextSegment(){

      if(!storyId){
        toast('Story unavailable');
        if(mediaEl) mediaEl.outerHTML = '<div class="story-reply-unavailable">Story unavailable</div>';
        return;
      }
      var snap = await db.collection('stories').doc(storyId).get();
      if(!snap.exists){
        toast('Story unavailable');
        if(mediaEl) mediaEl.outerHTML = '<div class="story-reply-unavailable">Story unavailable</div>';
        return;
      }
      var s = snap.data() || {};
      s.id = snap.id;
      // Expiry check (24h or explicit expiresAt)
      var created = s.createdAt && s.createdAt.toDate ? s.createdAt.toDate().getTime() : (s.createdAt ? new Date(s.createdAt).getTime() : 0);
      var exp = s.expiresAt && s.expiresAt.toDate ? s.expiresAt.toDate().getTime() : (created ? created + STORY_MS : 0);

        return;
      }
      var uid = ownerUid || s.uid || '';
      // Prefer existing loaded group
      var gi = -1, idx = 0;
      for(var i=0;i<storyGroups.length;i++){
        if(storyGroups[i].uid === uid){
          gi = i;
          for(var j=0;j<storyGroups[i].items.length;j++){
            if(storyGroups[i].items[j].id === storyId){ idx = j; break; }
          }
          break;
        }
      }
      if(gi < 0){
        // Build a temporary one-item group
        storyGroups.push({
          uid: uid,
          name: s.name || 'User',
          avatar: s.avatar || '',
          items: [s]
        });
        gi = storyGroups.length - 1;
        idx = 0;
      } else {
        // Ensure this story is in items
        var found = storyGroups[gi].items.some(function(it){ return it.id === storyId; });
        if(!found) storyGroups[gi].items.push(s);
        for(var k=0;k<storyGroups[gi].items.length;k++){
          if(storyGroups[gi].items[k].id === storyId){ idx = k; break; }
        }
      }
      openViewer(gi, idx);
    }catch(err){
      console.warn('openStoryFromReply', err);
      toast('Story unavailable');
      if(mediaEl) try{ mediaEl.outerHTML = '<div class="story-reply-unavailable">Story unavailable</div>'; }catch(e){}
    }
  };
})();

function openMsgCtx(id, data){
  if(!id) return;
  ctxMsgId = id; ctxMsgData = data || {};
  var mine = !!(data && user && data.uid === user.uid);
  var rawText = (data && data.text) ? String(data.text).trim() : '';
  var hasCopyableText = rawText.length > 0;
  // Edit only pure text bubbles (no media / voice / story-share attachments)
  var isPureText = hasCopyableText && !(data.imageUrl || data.videoUrl || data.audioUrl || data.voiceUrl || data.sharedPostId || data.sharedPostImg || data.sharedStoryId || data.sharedStoryImg || data.sharedStoryVideo);
  var sheet = $('msgCtxSheet');
  if(!sheet) return;
  var items = [];
  items.push({label:'Reply', action:'reply', ico:CTX_ICO.reply, danger:false});
  items.push({label:'Forward', action:'forward', ico:CTX_ICO.forward, danger:false});
  if(hasCopyableText) items.push({label:'Copy message', action:'copy', ico:CTX_ICO.copy, danger:false});
  if(mine && isPureText) items.push({label:'Edit', action:'edit', ico:CTX_ICO.edit, danger:false});
  items.push({label:'Delete for you', action:'delete', ico:CTX_ICO.del, danger:false});
  if(mine) items.push({label:'Unsend', action:'unsend', ico:CTX_ICO.unsend, danger:true});
  sheet.innerHTML = items.map(function(it){
    return '<button type="button" class="'+(it.danger?'danger':'')+'" data-ctx="'+it.action+'"><span>'+it.label+'</span>'+(it.ico||'')+'</button>';
  }).join('') + '<button type="button" class="msg-ctx-cancel" data-ctx="cancel">Cancel</button>';
  var el = $('msgCtx');
  if(el){ el.classList.add('open'); el.setAttribute('aria-hidden','false'); }
  if(!msgCtxNavPushed){
    msgCtxNavPushed = true;
    try{ history.pushState({ page: 'msgctx' }, '', location.hash || '#chat'); }catch(e){}
  }
}

async function runCtxAction(act){
  if(act === 'cancel'){
    closeMsgCtx(false);
    return;
  }
  if(!ctxMsgId){ closeMsgCtx(false); return; }
  var id = ctxMsgId;
  var m = ctxMsgData || {};
  var ref = db.collection('chats').doc(currentChat).collection('messages').doc(id);
  // Close UI; keep chat history entry (do not history.back — that was closing the chat)
  var el = $('msgCtx');
  if(el){ el.classList.remove('open'); el.setAttribute('aria-hidden','true'); }
  var hadNav = msgCtxNavPushed;
  msgCtxNavPushed = false;
  ctxMsgId = null; ctxMsgData = null;
  if(hadNav){
    try{
      if(currentChat) history.replaceState({ page: 'chat', chat: currentChat }, '', '#chat/' + currentChat);
      else history.replaceState({ page: 'chatsPage' }, '', '#chats');
    }catch(e){}
  }

  if(act === 'reply'){
    replyTarget = Object.assign({ id: id }, m);
    var preview = m.text || (m.imageUrl ? 'Photo' : m.videoUrl ? 'Video' : (m.audioUrl||m.voiceUrl) ? 'Voice message' : m.sharedPostId ? 'Attachment' : 'Message');
    if($('replyText')) $('replyText').textContent = (m.senderName||'User')+': '+preview;
    if($('replyBar')) $('replyBar').classList.add('show');
    if($('messageInput')) $('messageInput').focus();
  } else if(act === 'forward'){
    openForwardSheet(id, m);
  } else if(act === 'copy'){
    var t = (m.text || '').trim();
    if(!t){ toast('Nothing to copy'); return; }
    try{
      if(navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(t);
      else {
        var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      }
      toast('Copied');
    }catch(e){ toast('Could not copy'); }
  } else if(act === 'edit'){
    if(!m.text) return;
    var next = prompt('Edit message', m.text);
    if(next == null) return;
    next = String(next).trim();
    if(!next) return;
    await ref.set({ text: next, edited: true }, { merge: true });
    toast('Edited');
  } else if(act === 'unsend'){
    // Match main GoChat: hard delete for everyone
    try{
      await ref.delete();
      toast('Message unsent');
    }catch(e){
      try{
        await ref.set({ deletedForEveryone:true, unsent:true, text:'', imageUrl:null, videoUrl:null, audioUrl:null, voiceUrl:null }, { merge:true });
        toast('Message unsent');
      }catch(e2){ toast('Could not unsend'); }
    }
  } else if(act === 'delete'){
    try{
      await ref.set({ deletedFor: firebase.firestore.FieldValue.arrayUnion(user.uid) }, { merge: true });
      toast('Deleted for you');
    }catch(e){
      var deletedFor = Array.isArray(m.deletedFor) ? m.deletedFor.slice() : [];
      if(deletedFor.indexOf(user.uid) === -1) deletedFor.push(user.uid);
      await ref.set({ deletedFor: deletedFor }, { merge:true });
      toast('Deleted for you');
    }
  }
}

  if(!rows.length && window.__gcChatListCache){
    window.__gcChatListCache.forEach(function(c){
      if(!c.id || c.id === currentChat) return;
      if(q && String(c.name||'').toLowerCase().indexOf(q) === -1) return;
      rows.push(c);
    });
  }
  if(!rows.length){
    list.innerHTML = '<div class="empty" style="padding:24px;text-align:center;color:var(--muted)">No chats found. Open Chats tab once, then try again.</div>';
    return;
  }
  list.innerHTML = rows.map(function(c){
    var sel = !!gcFwdSelected[c.id];
    return '<button type="button" class="gc-fwd-row'+(sel?' selected':'')+'" data-fwd="'+esc(c.id)+'">'
      + (c.av ? '<img class="avatar" src="'+esc(c.av)+'" alt="">' : '<div class="avatar"></div>')
      + '<div class="chat-main"><div class="name">'+esc(c.name)+'</div></div>'
      + '<span class="gc-fwd-check">'+(sel?'✓':'')+'</span></button>';
  }).join('');
}
async function confirmForward(){
  if(gcFwdBusy || !gcFwdMsgId) return;
  var ids = Object.keys(gcFwdSelected);
  if(!ids.length) return;
  gcFwdBusy = true;
  try{
    var m = window.__gcFwdMsgData || {};
    // fetch latest if needed
    if(!m.uid){
      var snap = await db.collection('chats').doc(currentChat).collection('messages').doc(gcFwdMsgId).get();
      if(snap.exists) m = snap.data();
    }
    var payload = {
      uid: user.uid,
      senderName: userData.name || userData.displayName || 'User',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      forwarded: true
    };
    ['text','imageUrl','videoUrl','videoThumb','poster','thumbnail','audioUrl','voiceUrl',
     'sharedPostId','sharedPostImg','sharedPostAuthorName','sharedPostAuthorUser','sharedPostAuthorAvatar','sharedPostCaption'
    ].forEach(function(k){ if(m[k] != null && m[k] !== '') payload[k] = m[k]; });
    for(var i=0;i<ids.length;i++){
      await db.collection('chats').doc(ids[i]).collection('messages').add(payload);
      try{
        await db.collection('chats').doc(ids[i]).set({
          lastMessage: payload.text || (payload.imageUrl?'Photo':payload.videoUrl?'Video':payload.audioUrl?'Voice':'Forwarded message'),
          lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, {merge:true});
      }catch(e){}
    }
    toast('Forwarded');
    closeForwardSheet(false);
  }catch(e){
    toast(e.message || 'Forward failed');
  }finally{
    gcFwdBusy = false;
  }
}

/* Media viewer close — reliable, no stuck state */
function hardCloseMediaViewer(fromPop){
  mediaOpen = false;
  var stage = $('mediaStage');
  if(stage){
    stage.querySelectorAll('video').forEach(function(v){ try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(e){} });
    stage.innerHTML = '';
  }
  var controls = $('mediaControls');
  if(controls) controls.classList.remove('show');
  var mv = $('mediaViewer');
  if(mv){ mv.classList.remove('open'); mv.setAttribute('aria-hidden','true'); }
  closeMediaMenu();
  mediaCurrentUrl = '';
  // Stay inside the open chat. Do NOT history.back() — that was closing the chat.
  if(mediaNavPushed){
    mediaNavPushed = false;
    try{
      if(currentChat){
        history.replaceState({ page: 'chat', chat: currentChat, returnPage: chatReturnPage || 'chatsPage' }, '', '#chat/' + currentChat);
      } else {
        history.replaceState({ page: 'chatsPage' }, '', '#chats');
      }
    }catch(e){}
  }
}
// Override previous closeMediaViewer
closeMediaViewer = hardCloseMediaViewer;

/* Direct media chrome handlers — reliable on WebView/touch */
(function(){
  function wireMediaChrome(){
    var closeBtn = document.getElementById('mediaCloseBtn');
    var menuBtn = document.getElementById('mediaMenuBtn');
    if(closeBtn && !closeBtn._wired){
      closeBtn._wired = true;
      closeBtn.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        try{ hardCloseMediaViewer(false); }catch(err){ try{ closeMediaViewer(false); }catch(e2){} }
      }, true);
      closeBtn.addEventListener('touchend', function(e){
        e.preventDefault(); e.stopPropagation();
        try{ hardCloseMediaViewer(false); }catch(err){ try{ closeMediaViewer(false); }catch(e2){} }
      }, {passive:false, capture:true});
    }
    if(menuBtn && !menuBtn._wired){
      menuBtn._wired = true;
      menuBtn.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        try{ openMediaMenu(); }catch(err){}
      }, true);
    }
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wireMediaChrome);
  else wireMediaChrome();
  setTimeout(wireMediaChrome, 0);
})();


// Patch openMediaViewer to track nav flag — wrap if exists
(function(){
  var _open = openMediaViewer;
  openMediaViewer = function(url, kind, thumb){
    _open(url, kind, thumb);
    mediaNavPushed = true;
  };
})();

function bindMsgHold(listEl){
  if(!listEl || listEl._holdBound) return;
  listEl._holdBound = true;
  function startHold(e){
    var art = e.target.closest('article.msg');
    if(!art || e.target.closest('a,button,.gc-vp-play')) return;
    // Allow hold on media too
    msgHoldTarget = art;
    clearTimeout(msgHoldTimer);
    msgHoldTimer = setTimeout(function(){
      var id = art.getAttribute('data-id');
      if(!id || !currentChat) return;
      db.collection('chats').doc(currentChat).collection('messages').doc(id).get().then(function(snap){
        if(snap.exists) openMsgCtx(id, snap.data());
      }).catch(function(){});
    }, 280);
  }
  function cancelHold(){ clearTimeout(msgHoldTimer); msgHoldTimer = null; }
  listEl.addEventListener('touchstart', startHold, {passive:true});
  listEl.addEventListener('touchend', cancelHold);
  listEl.addEventListener('touchmove', cancelHold, {passive:true});
  listEl.addEventListener('touchcancel', cancelHold);
  listEl.addEventListener('mousedown', function(e){ if(e.button===0) startHold(e); });
  listEl.addEventListener('mouseup', cancelHold);
  listEl.addEventListener('mouseleave', cancelHold);
  listEl.addEventListener('contextmenu', function(e){
    var art = e.target.closest('article.msg');
    if(!art) return;
    e.preventDefault();
    cancelHold();
    var id = art.getAttribute('data-id');
    if(!id || !currentChat) return;
    db.collection('chats').doc(currentChat).collection('messages').doc(id).get().then(function(snap){
      if(snap.exists) openMsgCtx(id, snap.data());
    });
  });
}
if($('messages')) bindMsgHold($('messages'));

// Message list click: voice / shared / image / video
if($('messages') && !$('messages')._mediaClickBound){
  $('messages')._mediaClickBound = true;
  $('messages').addEventListener('click', function(e){
    if(e.target.closest('[data-action="voice-toggle"]')){
      e.preventDefault(); e.stopPropagation();
      var wrap = e.target.closest('.gc-voice-player');
      if(wrap) toggleVoicePlayer(wrap);
      return;
    }
    var attach = e.target.closest('[data-action="open-shared"]');
    if(attach){
      e.preventDefault();
      var img = attach.getAttribute('data-img') || '';
      var isVid = attach.getAttribute('data-vid') === '1';
      if(img) openMediaViewer(img, isVid ? 'video' : 'image');
      return;
    }
    var bubble = e.target.closest('.gc-chat-video-bubble[data-full], img[data-full]');
    if(bubble){
      e.preventDefault();
      openMediaViewer(bubble.getAttribute('data-full'), bubble.getAttribute('data-kind') || 'image', bubble.getAttribute('data-thumb'));
    }
  });
}

function toggleVoicePlayer(wrap){
  if(!wrap) return;
  var audio = wrap.querySelector('audio');
  var btn = wrap.querySelector('.gc-vp-play');
  var bar = wrap.querySelector('.gc-vp-bar > i');
  var timeEl = wrap.querySelector('.gc-vp-time');
  if(!audio) return;
  document.querySelectorAll('.gc-voice-player audio').forEach(function(a){ if(a !== audio){ try{ a.pause(); }catch(e){} } });
  document.querySelectorAll('.gc-voice-player .gc-vp-play').forEach(function(b){
    if(b !== btn) b.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  });
  if(audio.paused){
    audio.play().catch(function(){});
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
  } else {
    audio.pause();
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  }
  audio.ontimeupdate = function(){
    var pct = (audio.duration && isFinite(audio.duration)) ? (audio.currentTime/audio.duration*100) : 0;
    if(bar) bar.style.width = pct + '%';
    if(timeEl) timeEl.textContent = fmtAudioTime(audio.currentTime);
  };
  audio.onended = function(){
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    if(bar) bar.style.width = '0%';
  };
}

/* Event delegation for overlays — always works even if elements re-render */
document.addEventListener('click', function(e){
  var srm = e.target.closest('.story-reply-media');
  if(srm){
    e.preventDefault();
    e.stopPropagation();
    var sid = srm.getAttribute('data-story-id') || '';
    var suid = srm.getAttribute('data-story-uid') || '';
    if(typeof window.openStoryFromReply === 'function'){
      window.openStoryFromReply(sid, suid, srm);
    } else {
      toast('Story viewer unavailable');
    }
    return;
  }
  // Media close X
  if(e.target.closest('#mediaCloseBtn')){
    e.preventDefault(); e.stopPropagation();
    hardCloseMediaViewer(false);
    return;
  }
  if(e.target.closest('#mediaMenuBtn')){
    e.preventDefault(); e.stopPropagation();
    openMediaMenu();
    return;
  }
  if(e.target === $('mediaMenu')){
    closeMediaMenu();
    return;
  }
  if(e.target.closest('#mediaShareBtn')){ shareMediaCurrent(); return; }
  if(e.target.closest('#mediaSaveBtn')){ saveMediaCurrent(); return; }
  if(e.target.closest('#mvcPlay')){
    e.stopPropagation();
    var v = getViewerVideo && getViewerVideo();
    if(!v) return;
    if(v.paused) v.play().catch(function(){}); else v.pause();
    return;
  }
  // Context sheet
  if(e.target === $('msgCtx')){ closeMsgCtx(false); return; }
  var ctxBtn = e.target.closest('#msgCtx [data-ctx]');
  if(ctxBtn){ runCtxAction(ctxBtn.getAttribute('data-ctx')); return; }
  // Forward sheet
  if(e.target === $('gcFwdSheet') || e.target.closest('#gcFwdClose')){ closeForwardSheet(false); return; }
  var fwdRow = e.target.closest('[data-fwd]');
  if(fwdRow){
    var id = fwdRow.getAttribute('data-fwd');
    if(gcFwdSelected[id]) delete gcFwdSelected[id];
    else {
      if(Object.keys(gcFwdSelected).length >= 5){ toast('Max 5 chats'); return; }
      gcFwdSelected[id] = true;
    }
    var n = Object.keys(gcFwdSelected).length;
    $('gcFwdSend').disabled = n === 0;
    $('gcFwdSub').textContent = n ? (n + ' selected') : 'Select up to 5 chats';
    renderForwardList(($('gcFwdSearch') && $('gcFwdSearch').value) || '');
    return;
  }
  if(e.target.closest('#gcFwdSend')){ confirmForward(); return; }
});

if($('gcFwdSearch')){
  $('gcFwdSearch').addEventListener('input', function(){ renderForwardList(this.value); });
}
if($('mvcBar')){
  $('mvcBar').onclick = function(e){
    e.stopPropagation();
    var v = getViewerVideo && getViewerVideo();
    if(!v || !v.duration) return;
    var rect = e.currentTarget.getBoundingClientRect();
    var ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    v.currentTime = ratio * v.duration;
    updateMvcProgress();
  };
}

// Cache chat list when chats are rendered
(function(){
  var _orig = window.renderChatList || null;
})();
