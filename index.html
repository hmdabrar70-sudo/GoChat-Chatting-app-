.bottom-nav{position:fixed;z-index:12;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:76px;padding:8px 12px max(8px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-around;background:var(--nav);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.nav-item{flex:1;height:58px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:11px;font-weight:700}.nav-item svg{width:23px;height:23px;fill:currentColor;display:block}.nav-item.selected{color:var(--accent)}.app-shell{padding-bottom:90px}.main-page{display:none;padding:0 16px 18px}.main-page.active{display:block}.nav-user-avatar{width:25px;height:25px;border-radius:50%;object-fit:cover;border:1px solid currentColor}.auth-wrap{min-height:100dvh;display:grid;place-items:center;padding:28px 22px;background:var(--bg)}.auth-card{width:100%;max-width:390px}.brand{font-size:29px;font-weight:850;letter-spacing:-1.1px;margin-bottom:10px}.auth-sub{color:var(--muted);font-size:14px;line-height:1.55;margin-bottom:34px}.auth-card h1{font-size:25px;margin:0 0 8px;letter-spacing:-.5px}.field{height:54px;border-radius:99px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;padding:0 18px;margin:12px 0}.field input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:15px}.field button{background:transparent;padding:5px;color:var(--muted);display:grid;place-items:center}.field button svg{width:21px;height:21px}.login-btn{height:54px;width:100%;border-radius:99px;background:var(--accent);color:white;font-weight:800;margin-top:12px}.error{color:#d94a4a;font-size:13px;min-height:20px;margin:10px 8px}.hidden{display:none!important}.app-shell{max-width:520px;min-height:100dvh;margin:auto;padding-bottom:12px}.topbar{justify-content:space-between}.icon-btn{border:0}.chat-row{cursor:pointer}.chat-view{position:fixed;z-index:15;inset:0;background:var(--bg);display:none;flex-direction:column;max-width:520px;margin:auto;left:0;right:0}.chat-view.open{display:flex}.chat-head{height:68px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);flex:none}.chat-head .back-btn{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}.chat-head .back-btn svg{width:21px;height:21px}.chat-head .avatar{width:42px;height:42px}.chat-head-info{min-width:0;flex:1}.chat-head-info strong{display:block;font-size:15px}.chat-head-info small{color:var(--muted);font-size:12px}.messages{flex:1;overflow:auto;padding:16px 13px 20px;display:flex;flex-direction:column;gap:9px}.msg{max-width:82%;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:14px;line-height:1.45;overflow-wrap:anywhere;position:relative}.msg.mine{align-self:flex-end;background:var(--accent);color:#fff;border-color:transparent;border-bottom-right-radius:5px}.msg:not(.mine){align-self:flex-start;border-bottom-left-radius:5px}.msg time{display:block;font-size:10px;opacity:.68;text-align:right;margin-top:4px}.msg img,.msg video{max-width:100%;max-height:260px;border-radius:10px;display:block}.msg audio{max-width:230px}.msg-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.msg-actions button{font-size:11px;background:var(--surface2);color:var(--text);padding:5px 8px;border-radius:20px}.reply-bar{display:none;padding:8px 14px;background:var(--surface2);font-size:12px;color:var(--muted);align-items:center;justify-content:space-between}.reply-bar.show{display:flex}.composer{display:flex;align-items:center;gap:7px;padding:10px 10px max(10px,env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}.composer input[type=text]{flex:1;min-width:0;height:44px;border:0;outline:0;background:var(--surface2);border-radius:99px;padding:0 15px;color:var(--text)}.tool-btn,.send{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--text);flex:none}.tool-btn svg,.send svg{width:21px;height:21px}.send{background:var(--accent);color:#fff}.file-input{display:none}.empty{padding:35px 10px;text-align:center;color:var(--muted);font-size:14px}.toast{z-index:40}.searchbar{margin-top:4px}.avatar-fallback{display:grid;place-items:center;font-weight:800;color:white;background:linear-gradient(135deg,#f59e0b,#ec4899)}

/* Active tab · online people strip */
.active-wrap{padding:8px 0 24px}
.active-empty{padding:48px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.active-grid{display:flex;flex-wrap:wrap;gap:18px 14px;padding:8px 4px 20px;justify-content:flex-start}
.active-person{width:76px;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:var(--text)}
.active-person:active{opacity:.75}
.active-av-wrap{position:relative;width:64px;height:64px;flex:none}
.active-av-wrap img{width:64px;height:64px;border-radius:50%;object-fit:cover;display:block;background:var(--surface2);border:2px solid var(--line)}
.active-online-dot{position:absolute;right:1px;bottom:1px;width:14px;height:14px;border-radius:50%;background:#22c55e;border:2.5px solid var(--bg);box-shadow:0 0 0 1px rgba(34,197,94,.25)}
.active-person-name{font-size:12px;font-weight:650;text-align:center;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}

/* Friend search results */
.search-results{margin:0 0 10px;display:none}
.search-results.show{display:block}
.search-section-label{font-size:12px;font-weight:750;color:var(--muted);padding:6px 4px 8px;text-transform:uppercase;letter-spacing:.4px}
.friend-row{display:flex;align-items:center;gap:13px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:transparent}
.friend-row:active{opacity:.8}
.friend-row .avatar{width:48px;height:48px}
.friend-meta{min-width:0;flex:1}
.friend-meta .name{font-size:15px;font-weight:750}
.friend-meta .uname{font-size:12px;color:var(--muted);margin-top:3px}
.friend-badge{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:99px}

/* Boot loader — prevent login flash while Firebase restores session */
#bootLoader{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-size:14px;font-weight:650}
#bootLoader.hidden{display:none!important}
#authScreen.hidden{display:none!important}

/* Full-screen media viewer */
.media-viewer{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.96);align-items:center;justify-content:center;flex-direction:column;max-width:520px;margin:auto;left:0;right:0}
.media-viewer.open{display:flex}
.media-viewer-stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:56px 12px 24px;box-sizing:border-box;overflow:hidden}
.media-viewer-stage img,.media-viewer-stage video{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;background:#000}
.media-viewer-stage video{width:100%}
.zoom-actions-capsule{
  position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:14px;z-index:52;
  display:inline-flex;align-items:center;gap:0;padding:4px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 2px 12px rgba(0,0,0,.28);box-sizing:border-box
}
.zoom-actions-capsule .zoom-cap-btn{
  width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:#fff;
  display:grid;place-items:center;cursor:pointer;padding:0
}
.zoom-actions-capsule .zoom-cap-btn:active{opacity:.7}
.zoom-actions-capsule svg{width:20px;height:20px;fill:currentColor}
.media-menu-backdrop{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
.media-menu-backdrop.open{display:flex}
.media-menu-sheet{width:min(520px,100%);background:var(--surface);color:var(--text);border-radius:20px 20px 0 0;padding:12px 0 max(16px,env(safe-area-inset-bottom));box-shadow:var(--shadow)}
.media-menu-sheet button{width:100%;text-align:left;padding:14px 20px;background:transparent;border:0;color:var(--text);font-size:15px;font-weight:650;display:flex;align-items:center;gap:12px}
.media-menu-sheet button:active{background:var(--surface2)}
.media-menu-sheet button svg{width:20px;height:20px;flex:none}
.media-menu-cancel{border-top:1px solid var(--line)!important;color:var(--muted)!important;margin-top:4px}

/* Shared post attachment card */
.msg-attach{display:block;width:min(100%,240px);border-radius:14px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);text-align:left;padding:0;cursor:pointer;color:inherit}
.msg.mine .msg-attach{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2)}
.msg-attach-head{display:flex;align-items:center;gap:8px;padding:8px 10px}
.msg-attach-av{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#8883;flex:none}
.msg-attach-meta{min-width:0;flex:1}
.msg-attach-name{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-attach-user{font-size:11px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-attach-media{position:relative;width:100%;aspect-ratio:1.15;background:#000;overflow:hidden}
.msg-attach-media img,.msg-attach-media video{width:100%;height:100%;object-fit:cover;display:block}
.msg-attach-play{position:absolute;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;pointer-events:none}
.msg-attach-play.right{right:8px;bottom:8px}
.msg-attach-play.left{left:8px;bottom:8px}
.msg-attach-play svg{width:18px;height:18px}
.msg-attach-caption{padding:8px 10px;font-size:12px;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg a.msg-link{color:inherit;text-decoration:underline;word-break:break-all;font-weight:650}
.msg.mine a.msg-link{color:#fff}
.msg img[data-full],.msg video[data-full]{cursor:pointer}


/* —— Chat media (match main GoChat dimensions) —— */
.msg{position:relative;user-select:none;-webkit-user-select:none}
.msg.mine,.msg:not(.mine){max-width:82%}
.msg img[data-full]{display:block;width:min(100%,240px);max-width:240px;max-height:320px;height:auto;object-fit:contain;background:#000;cursor:pointer;border-radius:14px}
.msg .gc-chat-video-bubble{width:min(100%,240px);max-width:240px}
.msg .msg-attach{width:min(100%,240px);max-width:240px}
.gc-chat-video-bubble{position:relative;display:block;max-width:240px;border-radius:14px;overflow:hidden;background:#000;cursor:pointer;-webkit-tap-highlight-color:transparent}
.gc-chat-video-poster{display:block;width:100%;max-height:320px;object-fit:contain;background:#000;pointer-events:none}
.gc-chat-video-poster-empty{width:100%;height:180px;background:#111}
.gc-chat-video-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;pointer-events:none;z-index:2}
.gc-chat-video-play svg{width:22px;height:22px;margin-left:2px}

/* Hide permanent inline actions */
.msg-actions{display:none!important}

/* Long-press context sheet */
.msg-ctx-backdrop{display:none;position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.4);align-items:flex-end;justify-content:center}
.msg-ctx-backdrop.open{display:flex}
.msg-ctx-sheet{width:min(520px,100%);background:var(--surface);color:var(--text);border-radius:18px 18px 0 0;padding:8px 0 max(12px,env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:msgCtxUp .18s ease}
@keyframes msgCtxUp{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}
.msg-ctx-sheet button{width:100%;text-align:left;padding:14px 18px;background:transparent;border:0;color:var(--text);font-size:15px;font-weight:650;display:flex;align-items:center;gap:12px}
.msg-ctx-sheet button:active{background:var(--surface2)}
.msg-ctx-sheet button.danger{color:#e03131}
.msg-ctx-sheet button svg{width:20px;height:20px;flex:none}
.msg-ctx-cancel{border-top:1px solid var(--line)!important;color:var(--muted)!important;margin-top:4px;justify-content:center!important}

/* Custom voice player */
.gc-voice-player{display:flex;align-items:center;gap:10px;min-width:180px;max-width:240px;padding:2px 0;user-select:none}
.gc-vp-play{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;flex:none;display:grid;place-items:center;background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.msg.mine .gc-vp-play{color:var(--accent)}
.msg:not(.mine) .gc-vp-play{background:#fff;color:#ff8c42}
.gc-vp-play svg{width:16px;height:16px}
.gc-vp-meta{flex:1;min-width:0}
.gc-vp-bar{height:4px;border-radius:99px;background:rgba(0,0,0,.15);overflow:hidden}
.msg.mine .gc-vp-bar{background:rgba(255,255,255,.35)}
.gc-vp-bar>i{display:block;height:100%;width:0%;background:currentColor;border-radius:99px}
.gc-vp-time{font-size:11px;opacity:.8;margin-top:4px}

/* Full-screen media viewer — custom, no native chrome */
.media-viewer{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.96);flex-direction:column;max-width:520px;margin:auto;left:0;right:0}
.media-viewer.open{display:flex}
.media-viewer-stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:56px 12px 88px;box-sizing:border-box;overflow:hidden;position:relative}
.media-viewer-stage img{max-width:100%;max-height:100%;object-fit:contain}
.media-viewer-stage video{max-width:100%;max-height:100%;object-fit:contain;background:#000;width:100%}
.zoom-actions-capsule{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:14px;z-index:52;display:inline-flex;align-items:center;gap:0;padding:4px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 2px 12px rgba(0,0,0,.28)}
.zoom-actions-capsule .zoom-cap-btn{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.zoom-actions-capsule svg{width:20px;height:20px;fill:currentColor}
.media-viewer-controls{position:absolute;left:0;right:0;bottom:0;z-index:52;padding:12px 16px max(16px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.65));display:none;align-items:center;gap:12px;color:#fff}
.media-viewer-controls.show{display:flex}
.mvc-play{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;flex:none}
.mvc-play svg{width:18px;height:18px}
.mvc-bar{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;cursor:pointer}
.mvc-bar>i{display:block;height:100%;width:0%;background:#fff;border-radius:99px}
.mvc-time{font-size:12px;opacity:.9;min-width:72px;text-align:right}

.media-menu-backdrop{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
.media-menu-backdrop.open{display:flex}
.media-menu-sheet{width:min(520px,100%);background:var(--surface);color:var(--text);border-radius:20px 20px 0 0;padding:12px 0 max(16px,env(safe-area-inset-bottom));box-shadow:var(--shadow)}
.media-menu-sheet button{width:100%;text-align:left;padding:14px 20px;background:transparent;border:0;color:var(--text);font-size:15px;font-weight:650;display:flex;align-items:center;gap:12px}
.media-menu-sheet button:active{background:var(--surface2)}
.media-menu-cancel{border-top:1px solid var(--line)!important;color:var(--muted)!important;margin-top:4px}

/* Shared attachment card */
.msg-attach{display:block;width:min(100%,240px);border-radius:14px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);text-align:left;padding:0;cursor:pointer;color:inherit}
.msg.mine .msg-attach{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2)}
.msg-attach-head{display:flex;align-items:center;gap:8px;padding:8px 10px}
.msg-attach-av{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#8883;flex:none}
.msg-attach-meta{min-width:0;flex:1}
.msg-attach-name{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-attach-user{font-size:11px;opacity:.75}
.msg-attach-media{position:relative;width:100%;aspect-ratio:1.15;background:#000;overflow:hidden}
.msg-attach-media img{width:100%;height:100%;object-fit:cover;display:block}
.msg-attach-play{position:absolute;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;pointer-events:none}
.msg-attach-play.right{right:8px;bottom:8px}
.msg-attach-play.left{left:8px;bottom:8px}
.msg-attach-caption{padding:8px 10px;font-size:12px;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg a.msg-link{color:inherit;text-decoration:underline;word-break:break-all;font-weight:650}

function linkifyText(raw){
  var s = esc(raw || '');
  // URLs: http(s), www., or scheme://
  return s.replace(/((?:https?:\/\/|www\.)[^\s<]+|[a-z][a-z0-9+.-]*:\/\/[^\s<]+)/gi, function(url){
    var href = url;
    if(/^www\./i.test(href)) href = 'https://' + href;
    // strip trailing punctuation from display/href carefully
    var trail = '';
    while(/[.,);!\]]$/.test(href)){ trail = href.slice(-1) + trail; href = href.slice(0,-1); }
    return '<a class="msg-link" href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+esc(url.slice(0,url.length-trail.length))+'</a>'+esc(trail);
  });
}


function cloudinaryVideoPoster(url){
  if(!url) return '';
  var u = String(url);
  if(u.indexOf('/video/upload/') !== -1){
    return u.replace('/video/upload/', '/video/upload/so_0,f_jpg,w_640,h_640,c_limit/');
  }
  return '';
}
function captureVideoThumbBlob(file){
  return new Promise(function(resolve){
    try{
      var video = document.createElement('video');
      video.muted = true;
      video.playsInline = true;
      video.preload = 'auto';
      var url = URL.createObjectURL(file);
      video.src = url;
      var done = false;
      function finish(blob){
        if(done) return;
        done = true;
        try{ URL.revokeObjectURL(url); }catch(e){}
        resolve(blob || null);
      }
      video.onloadeddata = function(){
        try{ video.currentTime = Math.min(0.35, (video.duration||1) * 0.05); }catch(e){ finish(null); }
      };
      video.onseeked = function(){
        try{
          var c = document.createElement('canvas');
          c.width = video.videoWidth || 640;
          c.height = video.videoHeight || 360;
          c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
          c.toBlob(function(b){ finish(b); }, 'image/jpeg', 0.82);
        }catch(e){ finish(null); }
      };
      video.onerror = function(){ finish(null); };
      setTimeout(function(){ finish(null); }, 8000);
    }catch(e){ resolve(null); }
  });
}
async function uploadBlobToCloudinary(blob, filename, resourceType){
  var fd = new FormData();
  fd.append('file', blob, filename || 'file.jpg');
  fd.append('upload_preset', 'gochat');
  var endpoint = resourceType === 'video'
    ? 'https://api.cloudinary.com/v1_1/pfbi9lmx/video/upload'
    : 'https://api.cloudinary.com/v1_1/pfbi9lmx/image/upload';
  var r = await fetch(endpoint, { method:'POST', body: fd });
  var j = await r.json();
  if(!r.ok || !j.secure_url) throw new Error((j.error && j.error.message) || 'Upload failed');
  return j.secure_url;
}

  return '<div class="gc-chat-video-bubble" data-full="'+esc(url)+'" data-kind="video" data-thumb="'+esc(poster)+'" role="button" tabindex="0">'

    + '</div>';
}

function fmtAudioTime(s){
  s = Math.max(0, Math.floor(s||0));
  var m = Math.floor(s/60);
  var r = s % 60;
  return m + ':' + (r < 10 ? '0' : '') + r;
}

function isVideoUrl(url){
  if(!url) return false;
  return /\/video\//i.test(url) || /\.(mp4|webm|mov)(\?|$)/i.test(url);
}

function renderSharedAttachment(m, mine){
  var img = m.sharedPostImg || m.sharedPostImage || '';
  var isVid = isVideoUrl(img);
  var name = m.sharedPostAuthorName || m.sharedPostTitle || 'Post';
  var user = m.sharedPostAuthorUser || m.sharedPostUsername || '';
  var av = m.sharedPostAuthorAvatar || '';
  var caption = m.sharedPostCaption || m.sharedPostTitle || '';
  var postId = m.sharedPostId || '';
  var corner = mine ? 'right' : 'left';
  var media = '';
  if(img){
    if(isVid){
      var poster = img;
      if(img.indexOf('/video/upload/') !== -1){
        poster = img.replace('/video/upload/', '/video/upload/so_0,f_jpg,w_480,h_360,c_fill/');
      }
      media = '<span class="msg-attach-media"><img src="'+esc(poster)+'" alt=""><span class="msg-attach-play '+corner+'"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span></span>';
    } else {
      media = '<span class="msg-attach-media"><img src="'+esc(img)+'" alt=""></span>';
    }
  }
  return '<button type="button" class="msg-attach" data-action="open-shared" data-post="'+esc(postId)+'" data-img="'+esc(img)+'" data-vid="'+(isVid?'1':'0')+'">'
    + '<span class="msg-attach-head">'
    +   (av ? '<img class="msg-attach-av" src="'+esc(av)+'" alt="">' : '<span class="msg-attach-av"></span>')
    +   '<span class="msg-attach-meta"><span class="msg-attach-name">'+esc(name)+'</span>'
    +   (user ? '<span class="msg-attach-user">@'+esc(user)+'</span>' : '') + '</span>'
    + '</span>'
    + media
    + (caption ? '<span class="msg-attach-caption">'+esc(caption)+'</span>' : '')
    + '</button>';
}

function openMediaViewer(url, kind, thumb){
  if(!url) return;
  mediaCurrentUrl = url;
  mediaCurrentKind = kind || (isVideoUrl(url) ? 'video' : 'image');
  var stage = $('mediaStage');
  var controls = $('mediaControls');
  if(!stage) return;
  stage.innerHTML = '';
  if(controls) controls.classList.remove('show');
  if(mediaCurrentKind === 'video'){
    var v = document.createElement('video');
    v.src = url;
    v.setAttribute('playsinline','');
    v.setAttribute('webkit-playsinline','');
    v.preload = 'auto';
    v.controls = false;
    v.disablePictureInPicture = true;
    try{ v.setAttribute('controlsList','nodownload nofullscreen noremoteplayback'); }catch(e){}
    v.style.maxWidth = '100%';
    v.style.maxHeight = '100%';
    v.style.objectFit = 'contain';
    stage.appendChild(v);
    if(controls) controls.classList.add('show');
    syncMvcPlay(false);
    v.addEventListener('timeupdate', updateMvcProgress);
    v.addEventListener('play', function(){ syncMvcPlay(true); });
    v.addEventListener('pause', function(){ syncMvcPlay(false); });
    v.addEventListener('ended', function(){ syncMvcPlay(false); updateMvcProgress(); });
    try{ var p = v.play(); if(p && p.then) p.catch(function(){}); }catch(e){}
  } else {
    var img = document.createElement('img');
    img.src = url;
    img.alt = '';
    stage.appendChild(img);
  }
  var mv = $('mediaViewer');
  if(mv){ mv.classList.add('open'); mv.setAttribute('aria-hidden','false'); }
  mediaOpen = true;
  try{ history.pushState({ page: 'media', chat: currentChat || null }, '', (location.hash || '#chat') + '/media'); }catch(e){}
}
function getViewerVideo(){

}
function syncMvcPlay(playing){
  var icon = $('mvcPlayIcon');
  if(!icon) return;

    ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'

function updateMvcProgress(){
  var v = getViewerVideo();
  if(!v) return;
  var fill = $('mvcBarFill');
  var time = $('mvcTime');
  var pct = (v.duration && isFinite(v.duration)) ? (v.currentTime / v.duration * 100) : 0;
  if(fill) fill.style.width = pct + '%';
  if(time) time.textContent = fmtAudioTime(v.currentTime) + (v.duration && isFinite(v.duration) ? ' / ' + fmtAudioTime(v.duration) : '');
}
function closeMediaViewer(fromPop){

async function saveMediaCurrent(){
  closeMediaMenu();
  var url = mediaCurrentUrl;
  if(!url) return;
  try{
    var res = await fetch(url);
    var blob = await res.blob();
    var a = document.createElement('a');
    var obj = URL.createObjectURL(blob);
    a.href = obj;
    a.download = 'GoChat_' + (mediaCurrentKind === 'video' ? 'Video' : 'Image') + '_' + Date.now() + (mediaCurrentKind==='video'?'.mp4':'.jpg');
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(obj); }, 2000);
    toast('Saved');
  }catch(e){
    // Fallback: open in new tab
    try{ window.open(url, '_blank'); toast('Opened media'); }catch(err){ toast('Could not save media'); }
  }
}
async function shareMediaCurrent(){
  closeMediaMenu();
  var url = mediaCurrentUrl;
  if(!url) return;
  try{
    if(navigator.share){
      await navigator.share({ url: url, title: 'GoChat media' });
    } else if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(url);
      toast('Link copied');
    } else {
      window.open(url, '_blank');
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;
    try{ await navigator.clipboard.writeText(url); toast('Link copied'); }catch(err){ toast('Could not share'); }
  }
}


function openChat(chatId,otherUid,otherName,otherAvatar,isGroup,returnPage){
  if(isGroup == null) isGroup = false;
  chatReturnPage = returnPage || 'chatsPage';
  currentChat = chatId;
  currentOther = otherUid;
  replyTarget = null;
  if($('replyBar')) $('replyBar').classList.remove('show');
  if($('chatName')) $('chatName').textContent = otherName || 'Chat';
  if($('chatAvatar')) $('chatAvatar').src = otherAvatar || avatar({ name: otherName });
  if($('chatStatus')) $('chatStatus').textContent = '';
  if($('chatView')) $('chatView').classList.add('open');
  try{ history.pushState({ page: 'chat', chat: chatId, returnPage: chatReturnPage }, '', '#chat/' + chatId); }catch(e){}
  listenMessages(chatId);
  if(!isGroup && otherUid && otherUid !== 'group') listenOtherStatus(otherUid);
  // Backfill users[] so list queries work across both apps
  if(!isGroup && otherUid && otherUid !== 'group' && chatId && user){
    db.collection('chats').doc(chatId).get().then(function(doc){
      if(!doc.exists) return;
      var data = doc.data() || {};
      var needsUsers = !Array.isArray(data.users) || data.users.indexOf(user.uid) === -1;
      if(needsUsers){
        var parts = String(chatId).split('_');
        var users = (parts.length === 2) ? [parts[0], parts[1]] : [user.uid, otherUid];
        db.collection('chats').doc(chatId).set({ users: users, isRead: true }, { merge: true }).catch(function(){});
      } else {
        db.collection('chats').doc(chatId).set({ isRead: true }, { merge: true }).catch(function(){});
      }
    }).catch(function(){});
  }
}

function renderMessage(id,m){
  if((m.deletedFor||[]).includes(user.uid))return '';
  let mine=m.uid===user.uid,body='';
  if(m.deletedForEveryone===true||m.unsent===true){
    body='<i>This message was unsent</i>';
  } else if(m.sharedPostId || m.sharedPostImg){
    body = renderSharedAttachment(m, mine);
  } else if(m.imageUrl){
    body='<img src="'+esc(m.imageUrl)+'" loading="lazy" data-full="'+esc(m.imageUrl)+'" data-kind="image" alt="" draggable="false">';
  } else if(m.videoUrl){
    body = buildVideoBubble(m.videoUrl, m.videoThumb || m.poster || m.thumbnail || '');
  } else if(m.audioUrl||m.voiceUrl){
    body = buildVoicePlayer(m.audioUrl||m.voiceUrl);
  } else {
    body = linkifyText(m.text||'');
  }
  let reply=m.replyText?'<div style="border-left:2px solid currentColor;padding-left:8px;opacity:.72;margin-bottom:6px;font-size:12px">'+esc(m.replySender||'')+': '+esc(m.replyText)+'</div>':'';
  return '<article class="msg '+(mine?'mine':'')+'" data-id="'+esc(id)+'" data-mine="'+(mine?'1':'0')+'">'+reply+body+'<time>'+fmt(m.createdAt)+(mine?(m.read?' · Seen':' · Sent'):'')+'</time></article>';
}

async function sendPayload(payload){
  if(!currentChat||!user)return;
  var myName = userData.name || userData.displayName || (user.email && user.email.split('@')[0]) || 'User';
  var msg = {
    uid: user.uid,
    senderName: myName,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  Object.keys(payload||{}).forEach(function(k){ msg[k] = payload[k]; });
  if(replyTarget){
    msg.replyTo = replyTarget.id;
    msg.replySender = replyTarget.senderName || 'User';
    msg.replyText = replyTarget.text || (replyTarget.imageUrl ? 'Photo' : replyTarget.videoUrl ? 'Video' : 'Voice message');
    replyTarget = null;
    if($('replyBar')) $('replyBar').classList.remove('show');
  }
  await db.collection('chats').doc(currentChat).collection('messages').add(msg);
  var preview = msg.text || (msg.sharedPostId || msg.sharedPostImg ? 'Attachment' : msg.imageUrl ? 'Photo' : msg.videoUrl ? 'Video' : msg.audioUrl ? 'Voice message' : 'Message');
  var patch = {
    lastMsg: preview,
    lastAt: firebase.firestore.FieldValue.serverTimestamp(),
    lastSender: user.uid,
    isRead: false
  };
  // Keep 1:1 chats queryable from both apps via users[]
  if(currentOther && currentOther !== 'group' && String(currentChat).indexOf('group_') !== 0){
    patch.users = [user.uid, currentOther].filter(Boolean).sort();
    patch.names = {};
    patch.names[user.uid] = myName;
    patch.names[currentOther] = ($('chatName') && $('chatName').textContent) || 'User';
    patch.avatars = {};
    patch.avatars[user.uid] = userData.avatar || '';
    patch.avatars[currentOther] = ($('chatAvatar') && $('chatAvatar').src) || '';
  }
  await db.collection('chats').doc(currentChat).set(patch, { merge: true });
}

async function loadChatLists(){
  listUnsubs.forEach(function(u){ try{ u(); }catch(e){} });
  listUnsubs = [];
  chatMap.clear();
  var listEl = $('chatList');
  if(!listEl) return;
  if(!user){
    listEl.innerHTML = '<div class="empty">Sign in to see your chats.</div>';
    return;
  }
  listEl.innerHTML = '<div class="empty">Loading your GoChat conversations…</div>';
  var initial = true;
  var renderTimer = null;

  function scheduleRender(){
    if(renderTimer) clearTimeout(renderTimer);
    renderTimer = setTimeout(function(){
      renderTimer = null;
      renderChats();
      try{ renderActiveList(); }catch(e){}
    }, initial ? 60 : 20);
    initial = false;
  }

  function ingestChatDoc(id, data){
    if(!id) return;
    chatMap.set(id, { id: id, data: data || {} });
    var people = (data && (data.users || data.members)) || [];
    people.forEach(function(uid){ prefetchUser(uid); });
    if(data && !data.isGroup && String(id).indexOf('group_') !== 0){
      var parts = String(id).split('_');
      if(parts.length >= 2){
        // UIDs don't contain '_'; chatId is uidA_uidB
        var a = parts[0], b = parts.slice(1).join('_');
        if(a === user.uid) prefetchUser(b);
        else if(b === user.uid) prefetchUser(a);
        else {
          if(String(id).indexOf(user.uid) !== -1){
            var other = a === user.uid ? b : a;
            prefetchUser(other);
          }
        }
      }
    }
  }

  function prefetchUser(uid){
    if(!uid || uid === user.uid || usersCache.has(uid)) return;
    db.collection('users').doc(uid).get().then(function(u){
      if(u.exists){ usersCache.set(uid, Object.assign({ uid: uid }, u.data())); scheduleRender(); }
    }).catch(function(){});
  }

  function addSnap(snap){
    try{
      var changes = [];
      try { changes = snap.docChanges(); } catch(e) { changes = []; }
      if(changes && changes.length){
        changes.forEach(function(change){
          if(change.type === 'removed'){ chatMap.delete(change.doc.id); return; }
          ingestChatDoc(change.doc.id, change.doc.data() || {});
        });
      } else {
        snap.docs.forEach(function(d){ ingestChatDoc(d.id, d.data() || {}); });
      }
      scheduleRender();
    }catch(e){ console.error('chat snap error', e); }
  }

  function onErr(e){
    console.error('Chat list query failed', e);
    if(chatMap.size === 0 && listEl){
      listEl.innerHTML = '<div class="empty">Could not load chats: '+esc(e && e.message ? e.message : e)+'</div>';
    }
  }

  // Primary: same queries as main GoChat app
  try{
    listUnsubs.push(db.collection('chats').where('users','array-contains', user.uid).onSnapshot(addSnap, onErr));
    listUnsubs.push(db.collection('chats').where('members','array-contains', user.uid).onSnapshot(addSnap, function(e){ console.warn('group chat query', e); }));
  }catch(e){ onErr(e); }

  try{
    db.collection('chats').where('users','array-contains', user.uid).get().then(function(s){
      s.docs.forEach(function(d){ ingestChatDoc(d.id, d.data()||{}); });
      scheduleRender();
    }).catch(function(e){ console.warn('chat get', e); });
    db.collection('chats').where('members','array-contains', user.uid).get().then(function(s){
      s.docs.forEach(function(d){ ingestChatDoc(d.id, d.data()||{}); });
      scheduleRender();
    }).catch(function(){});
  }catch(e){}

  // Extra chat IDs stored on the user profile (pinned / muted / archived / accepted)
  try{
    var extra = []
      .concat(userData.pinnedChats || [])
      .concat(userData.mutedChats || [])
      .concat(userData.archivedChats || [])
      .concat(userData.acceptedChats || [])
      .concat(userData.activePrivateChats || []);
    var seen = {};
    extra.forEach(function(cid){
      if(!cid || seen[cid] || chatMap.has(cid)) return;
      seen[cid] = true;
      db.collection('chats').doc(cid).get().then(function(doc){
        if(doc.exists){ ingestChatDoc(doc.id, doc.data()||{}); scheduleRender(); }
      }).catch(function(){});
    });
  }catch(e){}

  // Probe deterministic 1:1 chat docs for network people (covers chats missing users[])
  loadPeopleAndProbeChats().then(function(){ scheduleRender(); }).catch(function(){});
}

function toMs(v){
  if(v == null || v === '') return 0;
  if(typeof v === 'number' && isFinite(v)) return v;
  if(typeof v.toMillis === 'function') return v.toMillis();
  if(typeof v.seconds === 'number') return v.seconds * 1000;
  var n = Number(v);
  return isFinite(n) ? n : 0;
}

function chatIdFor(otherUid){
  return [user.uid, otherUid].filter(Boolean).sort().join('_');
}

/* Mutual follow = friends in main GoChat */
function isMutualFriend(otherUid){
  if(!user || !otherUid || otherUid === user.uid) return false;
  var mine = userData || {};
  var following = Array.isArray(mine.following) ? mine.following : [];
  var friends = Array.isArray(mine.friends) ? mine.friends : [];
  if(friends.indexOf(otherUid) !== -1) return true;
  if(following.indexOf(otherUid) === -1) return false;
  var u = usersCache.get(otherUid);
  if(u){
    var theirFollowing = Array.isArray(u.following) ? u.following : [];
    if(theirFollowing.indexOf(user.uid) !== -1) return true;
  }
  return friends.indexOf(otherUid) !== -1;
}

function getMutualFriendIds(){
  var ids = {};
  var mine = userData || {};
  var following = Array.isArray(mine.following) ? mine.following : [];
  var friends = Array.isArray(mine.friends) ? mine.friends : [];
  var followers = Array.isArray(mine.followers) ? mine.followers : [];
  friends.forEach(function(id){ if(id && id !== user.uid) ids[id] = true; });
  following.forEach(function(id){
    if(!id || id === user.uid) return;
    if(followers.indexOf(id) !== -1){ ids[id] = true; return; }
    var u = usersCache.get(id);
    if(u){
      var theirFollowing = Array.isArray(u.following) ? u.following : [];
      if(theirFollowing.indexOf(user.uid) !== -1) ids[id] = true;
    } else {
      ids[id] = true; // candidate until profile confirms
    }
  });
  followers.forEach(function(id){
    if(id && following.indexOf(id) !== -1) ids[id] = true;
  });
  return Object.keys(ids);
}

async function runFriendSearch(q){
  var box = $('searchResults');
  if(!box) return;
  q = (q || '').trim().toLowerCase();
  if(!q){
    box.classList.remove('show');
    box.innerHTML = '';
    return;
  }
  box.classList.add('show');
  box.innerHTML = '<div class="empty" style="padding:16px">Searching friends…</div>';

  var mutualIds = getMutualFriendIds();
  var needFetch = mutualIds.filter(function(id){ return !usersCache.has(id); }).slice(0, 80);
  await Promise.all(needFetch.map(function(id){
    return db.collection('users').doc(id).get().then(function(doc){
      if(doc.exists) usersCache.set(id, Object.assign({ uid: id }, doc.data() || {}));
    }).catch(function(){});
  }));

  try{
    var qs = await db.collection('users').where('usernameLower', '>=', q).where('usernameLower', '<=', q + '\uf8ff').limit(15).get();
    qs.docs.forEach(function(d){ if(d.id !== user.uid){ usersCache.set(d.id, Object.assign({ uid: d.id }, d.data()||{})); }});
  }catch(e){}
  try{
    var qs2 = await db.collection('users').where('nameLower', '>=', q).where('nameLower', '<=', q + '\uf8ff').limit(15).get();
    qs2.docs.forEach(function(d){ if(d.id !== user.uid){ usersCache.set(d.id, Object.assign({ uid: d.id }, d.data()||{})); }});
  }catch(e){}

  // Rebuild strict mutual list
  mutualIds = getMutualFriendIds().filter(function(id){
    var u = usersCache.get(id);
    if(!u) return false;
    var mine = userData || {};
    var following = Array.isArray(mine.following) ? mine.following : [];
    var friends = Array.isArray(mine.friends) ? mine.friends : [];
    if(friends.indexOf(id) !== -1) return true;
    if(following.indexOf(id) === -1) return false;
    var theirFollowing = Array.isArray(u.following) ? u.following : [];
    return theirFollowing.indexOf(user.uid) !== -1;
  });

  var hits = [];
  mutualIds.forEach(function(id){
    var u = usersCache.get(id) || {};
    var name = (u.name || u.displayName || '').toLowerCase();
    var uname = (u.username || u.usernameLower || '').toLowerCase();
    if(name.indexOf(q) !== -1 || uname.indexOf(q) !== -1 || String(id).toLowerCase().indexOf(q) !== -1){
      hits.push({
        uid: id,
        name: u.name || u.displayName || 'User',
        username: u.username || '',
        avatar: u.avatar || u.photoURL || avatar({ name: u.name || 'User' })
      });
    }
  });
  hits.sort(function(a,b){ return a.name.localeCompare(b.name); });
  hits = hits.slice(0, 30);

  if(!hits.length){
    box.innerHTML = '<div class="empty" style="padding:18px 8px">No mutual friends match this search.<br><span style="font-size:12px;opacity:.75">Only people you follow each other with appear here.</span></div>';
    return;
  }
  box.innerHTML = '<div class="search-section-label">Friends</div>' + hits.map(function(p){
    var cid = chatIdFor(p.uid);
    var handle = p.username ? ('@'+p.username) : '';
    return '<button type="button" class="friend-row" data-chat="'+esc(cid)+'" data-uid="'+esc(p.uid)+'" data-name="'+esc(p.name)+'" data-avatar="'+esc(p.avatar)+'">'
      + '<img class="avatar" src="'+esc(p.avatar)+'" alt="">'
      + '<span class="friend-meta"><span class="name">'+esc(p.name)+'</span><span class="uname">'+esc(handle)+'</span></span>'
      + '<span class="friend-badge">Chat</span>'
      + '</button>';
  }).join('');
}

function isPresenceOnline(data){
  if(!data || data.showActiveStatus === false || data.online !== true) return false;
  // Main app: heartbeat ~25s, 90s grace
  var t = toMs(data.lastSeen);
  if(!t) return !!data.online;
  return (Date.now() - t) < 90000;
}

async function loadPeopleAndProbeChats(){
  if(!user) return;
  var ids = {};
  function addId(x){ if(x && x !== user.uid) ids[x] = true; }
  try{
    var d = userData || {};
    (d.following || []).forEach(addId);
    (d.followers || []).forEach(addId);
    (d.friends || []).forEach(addId);
    (d.acceptedChats || []).forEach(addId);
    getMutualFriendIds().forEach(addId);
  }catch(e){}

  try{
    var snap = await db.collection('users').limit(200).get();
    snap.docs.forEach(function(doc){
      if(doc.id === user.uid) return;
      var data = doc.data() || {};
      usersCache.set(doc.id, Object.assign({ uid: doc.id }, data));
      var theirFollowing = Array.isArray(data.following) ? data.following : [];
      var myFollowing = Array.isArray((userData||{}).following) ? userData.following : [];
      if(myFollowing.indexOf(doc.id) !== -1 || theirFollowing.indexOf(user.uid) !== -1) addId(doc.id);
    });
  }catch(e){ console.warn('people directory', e); }

  var uidList = Object.keys(ids);
  var pending = uidList.filter(function(id){ return !usersCache.has(id); }).slice(0, 120);
  await Promise.all(pending.map(function(id){
    return db.collection('users').doc(id).get().then(function(u){
      if(u.exists) usersCache.set(id, Object.assign({ uid: id }, u.data() || {}));
    }).catch(function(){});
  }));

  var probe = uidList.slice(0, 200);
  await Promise.all(probe.map(function(otherUid){
    var cid = chatIdFor(otherUid);
    if(chatMap.has(cid)) return Promise.resolve();
    return db.collection('chats').doc(cid).get().then(function(doc){
      if(doc.exists){
        var data = doc.data() || {};
        if(!Array.isArray(data.users) || data.users.indexOf(user.uid) === -1){
          var sorted = [user.uid, otherUid].sort();
          db.collection('chats').doc(cid).set({ users: sorted }, { merge: true }).catch(function(){});
          data.users = sorted;
        }
        chatMap.set(doc.id, { id: doc.id, data: data });
      }
    }).catch(function(){});
  }));
}

function renderChats(){
  var listEl = $('chatList');
  if(!listEl || !user) return;
  var q = ($('chatSearch') && $('chatSearch').value || '').trim().toLowerCase();
  var rows = [];
  var seenPeople = {};

  chatMap.forEach(function(entry){
    var id = entry.id;
    var data = entry.data || {};
    var isGroup = !!(data.isGroup || String(id).indexOf('group_') === 0);

    // Membership: trust query results + chatId containing my uid + users/members arrays
    var isMyChat = false;
    if(String(id).indexOf(user.uid) !== -1) isMyChat = true;
    if(Array.isArray(data.users) && data.users.indexOf(user.uid) !== -1) isMyChat = true;
    if(Array.isArray(data.members) && data.members.indexOf(user.uid) !== -1) isMyChat = true;
    if(data.names && typeof data.names === 'object' && (user.uid in data.names)) isMyChat = true;
    if(!isMyChat) return;

    if(Array.isArray(data.hiddenFor) && data.hiddenFor.indexOf(user.uid) !== -1) return;

    // Clear Chat: hide only until a NEWER message exists (strictly after clear)
    var myClearAt = toMs((data.clearedAtBy || {})[user.uid]);
    if(myClearAt){
      var lastMs = toMs(data.lastAt || data.lastMsgAt || data.updatedAt);
      if(!lastMs || lastMs <= myClearAt) return;
    }

    if(isGroup){
      var gName = data.groupName || data.name || 'Group chat';
      rows.push({
        kind: 'chat', id: id, data: data, uid: 'group', group: true,
        name: gName,
        avatar: data.groupAvatar || data.avatar || avatar({ name: gName }),
        preview: data.lastMsg || 'Group chat',
        sort: toMs(data.lastAt) || 1,
        unread: false
      });
      return;
    }

    var people = Array.isArray(data.users) ? data.users : (Array.isArray(data.members) ? data.members : []);
    var other = null;
    for(var i=0;i<people.length;i++){ if(people[i] && people[i] !== user.uid){ other = people[i]; break; } }
    if(!other){
      var parts = String(id).split('_');
      if(parts.length >= 2){
        var left = parts[0], right = parts.slice(1).join('_');
        if(left === user.uid) other = right;
        else if(right === user.uid) other = left;
        else if(String(id).indexOf(user.uid) === 0) other = String(id).slice(user.uid.length + 1);
        else if(String(id).indexOf(user.uid) > 0) other = String(id).slice(0, String(id).indexOf(user.uid) - 1);
      }
    }
    if(!other) return;
    seenPeople[other] = true;

    var u = usersCache.get(other) || {};
    var names = data.names || {};
    var avatars = data.avatars || {};
    var displayName = u.name || u.displayName || names[other] || 'GoChat user';
    var displayAv = u.avatar || u.photoURL || avatars[other] || avatar({ name: displayName });
    rows.push({
      kind: 'chat', id: id, data: data, uid: other, group: false,
      name: displayName, avatar: displayAv,
      preview: data.lastMsg || 'Start chatting',
      sort: toMs(data.lastAt) || 1,
      unread: !!(data.lastSender && data.lastSender !== user.uid && data.isRead === false)
    });
  });

  // Sort conversations by latest activity first
  rows.sort(function(a,b){ return (b.sort || 0) - (a.sort || 0); });

  if(q){
    rows = rows.filter(function(x){
      return (x.name || '').toLowerCase().indexOf(q) !== -1
        || String(x.uid || '').toLowerCase().indexOf(q) !== -1
        || String(x.preview || '').toLowerCase().indexOf(q) !== -1;
    });
  }

  if(!rows.length){
    listEl.innerHTML = '<div class="empty">No conversations yet.<br><span style="font-size:12px;opacity:.75">Chats from the main GoChat app appear here once loaded.</span></div>';
    return;
  }

  listEl.innerHTML = rows.map(function(x){
    return '<button class="chat-row" type="button" data-chat="'+esc(x.id)+'" data-uid="'+esc(x.uid)+'" data-name="'+esc(x.name)+'" data-avatar="'+esc(x.avatar)+'" data-group="'+(x.group?'true':'false')+'">'
      + '<img class="avatar" src="'+esc(x.avatar)+'" alt="">'
      + '<span class="chat-main"><span class="name-line"><span class="name">'+esc(x.name)+'</span><span class="time">'+esc(fmt(x.data.lastAt))+'</span></span>'
      + '<span class="preview">'+esc(x.preview || '')+'</span></span>'
      + (x.unread ? '<span class="unread">•</span>' : '')
      + '</button>';
  }).join('');
}

function renderActiveList(){
  var box = $('activeList');
  if(!box || !user) return;
  var people = [];
  usersCache.forEach(function(u, uid){
    if(!uid || uid === user.uid) return;
    if(u.isDeleted) return;
    if(!isPresenceOnline(u)) return;
    people.push({
      uid: uid,
      name: u.name || u.displayName || 'User',
      avatar: u.avatar || u.photoURL || avatar({ name: u.name || 'User' })
    });
  });
  // Also mark online from chat partners already in cache
  people.sort(function(a,b){ return a.name.localeCompare(b.name); });

  if(!people.length){
    box.innerHTML = '<div class="active-empty">No one is active right now.<br>When friends are online, they will show up here.</div>';
    return;
  }

  box.innerHTML = people.map(function(p){
    var cid = chatIdFor(p.uid);
    return '<button type="button" class="active-person" data-chat="'+esc(cid)+'" data-uid="'+esc(p.uid)+'" data-name="'+esc(p.name)+'" data-avatar="'+esc(p.avatar)+'">'

      +   '<span class="active-online-dot" aria-hidden="true"></span>'
      + '</span>'
      + '<span class="active-person-name">'+esc(p.name)+'</span>'
      + '</button>';
  }).join('');
}

}

async function runCtxAction(act){
  if(act === 'cancel' || !ctxMsgId){ closeMsgCtx(false); return; }
  var id = ctxMsgId;
  var m = ctxMsgData || {};
  var ref = db.collection('chats').doc(currentChat).collection('messages').doc(id);
  closeMsgCtx(true);
  try{ if(history.state && history.state.page === 'msgctx') history.back(); }catch(e){}
  if(act === 'reply'){
    replyTarget = Object.assign({ id: id }, m);
    if($('replyText')) $('replyText').textContent = 'Replying to '+(m.senderName||'User')+': '+(m.text|| (m.imageUrl?'Photo':m.videoUrl?'Video':m.audioUrl?'Voice':'Media'));
    if($('replyBar')) $('replyBar').classList.add('show');
    if($('messageInput')) $('messageInput').focus();
  } else if(act === 'forward'){
    var target = prompt('Enter the recipient chat ID to forward this message:');
    if(!target) return;
    var f = { uid:user.uid, senderName:userData.name||'User', createdAt: firebase.firestore.FieldValue.serverTimestamp(), forwarded:true };
    ['text','imageUrl','videoUrl','videoThumb','audioUrl','voiceUrl','sharedPostId','sharedPostImg','sharedPostAuthorName','sharedPostAuthorUser','sharedPostAuthorAvatar','sharedPostCaption'].forEach(function(k){ if(m[k]) f[k]=m[k]; });
    await db.collection('chats').doc(target).collection('messages').add(f);
    toast('Forwarded');
  } else if(act === 'copy'){
    var t = m.text || m.imageUrl || m.videoUrl || m.audioUrl || '';
    try{ await navigator.clipboard.writeText(t); toast('Copied'); }catch(e){ toast('Could not copy'); }
  } else if(act === 'unsend'){
    await ref.set({ deletedForEveryone:true, unsent:true, text:'', imageUrl:null, videoUrl:null, audioUrl:null }, { merge:true });
    toast('Unsent');
  } else if(act === 'delete'){
    var deletedFor = Array.isArray(m.deletedFor) ? m.deletedFor.slice() : [];
    if(deletedFor.indexOf(user.uid) === -1) deletedFor.push(user.uid);
    await ref.set({ deletedFor: deletedFor }, { merge:true });
  }
}

if($('msgCtx')) $('msgCtx').addEventListener('click', function(e){
  if(e.target === $('msgCtx')) closeMsgCtx(false);
  var btn = e.target.closest('[data-ctx]');
  if(btn) runCtxAction(btn.getAttribute('data-ctx'));
});

function bindMsgHold(listEl){
  if(!listEl || listEl._holdBound) return;
  listEl._holdBound = true;
  function startHold(e){
    var art = e.target.closest('article.msg');
    if(!art || e.target.closest('a,button,.gc-vp-play,.gc-chat-video-bubble,img[data-full]')) return;
    msgHoldTarget = art;
    clearTimeout(msgHoldTimer);
    msgHoldTimer = setTimeout(function(){
      var id = art.getAttribute('data-id');
      if(!id || !currentChat) return;
      db.collection('chats').doc(currentChat).collection('messages').doc(id).get().then(function(snap){
        if(snap.exists) openMsgCtx(id, snap.data());
      }).catch(function(){});
    }, 450);
  }
  function cancelHold(){ clearTimeout(msgHoldTimer); msgHoldTimer = null; }
  listEl.addEventListener('touchstart', startHold, {passive:true});
  listEl.addEventListener('touchend', cancelHold);
  listEl.addEventListener('touchmove', cancelHold, {passive:true});
  listEl.addEventListener('touchcancel', cancelHold);
  listEl.addEventListener('mousedown', function(e){ if(e.button===0) startHold(e); });
  listEl.addEventListener('mouseup', cancelHold);
  listEl.addEventListener('mouseleave', cancelHold);
  listEl.addEventListener('contextmenu', function(e){
    var art = e.target.closest('article.msg');
    if(!art) return;
    e.preventDefault();
    cancelHold();
    var id = art.getAttribute('data-id');
    if(!id || !currentChat) return;
    db.collection('chats').doc(currentChat).collection('messages').doc(id).get().then(function(snap){
      if(snap.exists) openMsgCtx(id, snap.data());
    });
  });
}
if($('messages')) bindMsgHold($('messages'));

// Media open from bubble (image / static video)
if($('messages')) $('messages').addEventListener('click', function(e){
  if(e.target.closest('[data-action="voice-toggle"]')){
    e.preventDefault();
    e.stopPropagation();
    var wrap = e.target.closest('.gc-voice-player');
    if(wrap) toggleVoicePlayer(wrap);
    return;
  }
  var attach = e.target.closest('[data-action="open-shared"]');
  if(attach){
    e.preventDefault();
    var img = attach.getAttribute('data-img') || '';
    var isVid = attach.getAttribute('data-vid') === '1';
    if(img) openMediaViewer(img, isVid ? 'video' : 'image');
    return;
  }
  var bubble = e.target.closest('.gc-chat-video-bubble[data-full], img[data-full]');
  if(bubble){
    e.preventDefault();
    openMediaViewer(bubble.getAttribute('data-full'), bubble.getAttribute('data-kind') || 'image', bubble.getAttribute('data-thumb'));
  }
});

function toggleVoicePlayer(wrap){
  if(!wrap) return;
  var audio = wrap.querySelector('audio');
  var btn = wrap.querySelector('.gc-vp-play');
  var bar = wrap.querySelector('.gc-vp-bar > i');
  var timeEl = wrap.querySelector('.gc-vp-time');
  if(!audio) return;
  // pause other voice players
  document.querySelectorAll('.gc-voice-player audio').forEach(function(a){
    if(a !== audio){ try{ a.pause(); }catch(e){} }
  });
  document.querySelectorAll('.gc-voice-player .gc-vp-play').forEach(function(b){
    if(b !== btn) b.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  });
  if(audio.paused){
    audio.play().catch(function(){});
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
  } else {
    audio.pause();
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  }
  audio.ontimeupdate = function(){
    var pct = (audio.duration && isFinite(audio.duration)) ? (audio.currentTime/audio.duration*100) : 0;
    if(bar) bar.style.width = pct + '%';
    if(timeEl) timeEl.textContent = fmtAudioTime(audio.currentTime);
  };
  audio.onended = function(){
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    if(bar) bar.style.width = '0%';
  };
}

if($('mediaShareBtn')) $('mediaShareBtn').onclick = function(){ shareMediaCurrent(); };
if($('mediaSaveBtn')) $('mediaSaveBtn').onclick = function(){ saveMediaCurrent(); };
if($('mvcPlay')) $('mvcPlay').onclick = function(e){
  e.stopPropagation();
  var v = getViewerVideo();
  if(!v) return;
  if(v.paused){ v.play().catch(function(){}); } else { v.pause(); }
};
if($('mvcBar')) $('mvcBar').onclick = function(e){
  e.stopPropagation();
  var v = getViewerVideo();
  if(!v || !v.duration) return;
  var rect = e.currentTarget.getBoundingClientRect();
  var ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
  v.currentTime = ratio * v.duration;
  updateMvcProgress();
};

  if(e.target === $('mediaViewer') || e.target === $('mediaStage')){

  }
});
